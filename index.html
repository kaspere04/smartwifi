```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal - الإصدار المستقر</title>
    <style>
        :root { --gold: #FFCC00; --dark: #111; --bg: #f4f7f6; --red: #e74c3c; --green: #2ecc71; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; overflow-x: hidden; }
        header { background: var(--dark); color: white; padding: 25px; text-align: center; border-bottom: 5px solid var(--gold); }
        .container { padding: 15px; max-width: 480px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; margin-top: -15px; position: relative; z-index: 10; }
        input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; }
        .btn-main { width: 100%; padding: 15px; background: var(--dark); color: var(--gold); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { opacity: 0.5; background: #666; cursor: not-allowed; }
        .hidden { display: none !important; }
        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .m-btn { padding: 12px 5px; border: 1px solid #eee; border-radius: 10px; font-size: 12px; cursor: pointer; background: #fff; text-align: center; color: #666; }
        .m-btn.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--dark); }
        .u-card { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-right: 6px solid var(--gold); }
        .client-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        #history-list { background: white; border-radius: 15px; border: 1px solid #eee; overflow: hidden; margin-top: 15px; }
        .hist-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .badge-paid { background: #e8f5e9; color: var(--green); }
        .badge-unpaid { background: #ffebee; color: var(--red); }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0">SMART WIFI <span style="color:var(--gold)">AZILAL</span></h2>
    </header>

    <div class="container">
        <!-- Login View -->
        <div id="view-login" class="card">
            <h3 style="text-align:center; margin-top:0">دخول المشتركين</h3>
            <input type="text" id="login-id" placeholder="أدخل رقم التعريف">
            <button class="btn-main" id="btn-login-action" onclick="app.login()">دخول</button>
            <div id="status-text" style="font-size:10px; text-align:center; margin-top:10px; color:#999">جاري تهيئة النظام...</div>
        </div>

        <!-- User View -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <small>الزبون:</small>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <small>سنة 2025</small>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                <div class="card" style="margin:0; text-align:center"><small>الاشتراك</small><br><b id="u-price">0</b><small> د.م</small></div>
                <div class="card" style="margin:0; text-align:center"><small>المتأخرات</small><br><b id="u-due" style="color:var(--red)">0</b><small> د.م</small></div>
            </div>
            <div id="history-list"></div>
            <button class="btn-main" style="margin-top:20px; background:#ddd; color:#333" onclick="location.reload()">خروج</button>
        </div>

        <!-- Admin View -->
        <div id="view-admin" class="hidden">
            <div class="card">
                <h3 style="margin-top:0">إدارة المشتركين</h3>
                <input type="text" id="adm-name" placeholder="الاسم الكامل">
                <input type="text" id="adm-id" placeholder="رقم التعريف">
                <input type="number" id="adm-price" placeholder="الثمن الشهري">
                <p style="font-size:13px; font-weight:bold; margin-bottom:5px">تحديد الأشهر المؤداة:</p>
                <div class="m-grid" id="month-grid"></div>
                <button class="btn-main" id="btn-save" onclick="app.saveClient()" disabled>انتظر الاتصال بالسيرفر...</button>
                <button class="btn-main" style="margin-top:8px; background:#f0f0f0; color:#444" onclick="app.clearForm()">+ مسح الحقول</button>
            </div>
            <div id="admin-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_ID = "0602359188";
        
        let db, auth, user, clients = [], activeMonths = [];
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'azilal-wifi-final';

        const app = {
            async init() {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const fbApp = initializeApp(firebaseConfig);
                    db = getFirestore(fbApp);
                    auth = getAuth(fbApp);

                    // القاعدة 3: تسجيل الدخول أولاً
                    const initAuth = async () => {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    };

                    initAuth();

                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            user = u;
                            document.getElementById('status-text').innerText = "النظام جاهز ✅";
                            const saveBtn = document.getElementById('btn-save');
                            if(saveBtn) {
                                saveBtn.disabled = false;
                                saveBtn.innerText = "حفظ البيانات";
                            }
                            this.loadData();
                        }
                    });

                    this.drawGrid();
                } catch (e) {
                    document.getElementById('status-text').innerText = "خطأ في الاتصال ❌";
                }
            },

            loadData() {
                // القاعدة 1: المسار المسموح به
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'clients');
                onSnapshot(colRef, (snap) => {
                    clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    this.renderList();
                }, (err) => console.error("Data Load Error:", err));
            },

            drawGrid() {
                const grid = document.getElementById('month-grid');
                if(!grid) return;
                grid.innerHTML = '';
                months.forEach(m => {
                    const btn = document.createElement('div');
                    btn.className = 'm-btn' + (activeMonths.includes(m) ? ' active' : '');
                    btn.innerText = m;
                    btn.onclick = () => {
                        if (activeMonths.includes(m)) activeMonths = activeMonths.filter(x => x !== m);
                        else activeMonths.push(m);
                        this.drawGrid();
                    };
                    grid.appendChild(btn);
                });
            },

            login() {
                const val = document.getElementById('login-id').value.trim();
                if (!val) return;
                
                if (val === ADMIN_ID) {
                    this.switchView('view-admin');
                    this.drawGrid();
                } else {
                    const found = clients.find(c => String(c.id) === val);
                    if (found) {
                        this.switchView('view-user');
                        this.renderUser(found);
                    } else {
                        alert("المعرف غير موجود");
                    }
                }
            },

            switchView(vid) {
                ['view-login', 'view-admin', 'view-user'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
                document.getElementById(vid).classList.remove('hidden');
            },

            async saveClient() {
                if (!user) return alert("بانتظار المصادقة...");
                
                const name = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const price = document.getElementById('adm-price').value;

                if (!name || !id || !price) return alert("املأ كل الحقول");

                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.innerText = "جاري الحفظ...";

                try {
                    // القاعدة 1: المسار الصارم
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'clients', id);
                    await setDoc(docRef, {
                        name, id, price: Number(price),
                        paid: activeMonths,
                        ts: Date.now()
                    });
                    alert("تم الحفظ بنجاح ✓");
                    this.clearForm();
                } catch (e) {
                    alert("حدث خطأ في الحفظ: " + e.message);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "حفظ البيانات";
                }
            },

            renderList() {
                const list = document.getElementById('admin-list');
                if (!list) return;
                list.innerHTML = '<p style="font-size:12px; color:#888; margin-top:15px">الزبناء الحاليين:</p>';
                clients.sort((a,b) => b.ts - a.ts).forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'client-item';
                    div.innerHTML = `
                        <div><b>${c.name}</b><br><small>${c.id}</small></div>
                        <div style="display:flex; gap:10px">
                            <button onclick="app.edit('${c.id}')" style="color:blue; background:none; border:none; font-size:12px">تعديل</button>
                            <button onclick="app.remove('${c.id}')" style="color:red; background:none; border:none; font-size:12px">حذف</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            edit(id) {
                const c = clients.find(x => x.id === id);
                if (!c) return;
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                activeMonths = Array.isArray(c.paid) ? [...c.paid] : [];
                this.drawGrid();
                window.scrollTo({top:0, behavior:'smooth'});
            },

            async remove(id) {
                if (confirm("هل تريد حذف هذا المشترك؟")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id));
                }
            },

            clearForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                activeMonths = [];
                this.drawGrid();
            },

            renderUser(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price;
                
                const curMonthIdx = new Date().getMonth();
                const pastMonths = months.slice(0, curMonthIdx + 1);
                const paidData = u.paid || [];
                
                const unpaid = pastMonths.filter(m => !paidData.includes(m)).length;
                document.getElementById('u-due').innerText = unpaid * u.price;

                const hist = document.getElementById('history-list');
                hist.innerHTML = '';
                [...pastMonths].reverse().forEach(m => {
                    const isPaid = paidData.includes(m);
                    const row = document.createElement('div');
                    row.className = 'hist-row';
                    row.innerHTML = `
                        <span>شهر ${m}</span>
                        <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">${isPaid ? 'مؤدى ✓' : 'غير مؤدى'}</span>
                    `;
                    hist.appendChild(row);
                });
            }
        };

        app.init();
        window.app = app;
    </script>
</body>
</html>
