<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART WIFI AZILAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        * { font-family: 'Tajawal', sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 pb-10">

    <header class="bg-slate-900 text-white p-6 shadow-xl border-b-4 border-yellow-400 text-center">
        <h1 class="font-black text-2xl tracking-tighter">SMART WIFI <span class="text-yellow-400">AZILAL</span></h1>
    </header>

    <div class="max-w-md mx-auto p-4 mt-6">
        <div id="v-login" class="bg-white p-8 rounded-3xl shadow-lg text-center border border-slate-200">
            <h2 class="text-xl font-bold mb-6 text-slate-800">تسجيل الدخول</h2>
            <input type="tel" id="login-id" class="w-full p-4 bg-slate-50 border rounded-2xl text-center text-xl font-bold mb-4 outline-none focus:border-yellow-400" placeholder="رقم الهاتف">
            <button onclick="login()" class="w-full bg-slate-900 text-yellow-400 font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">دخول</button>
        </div>

        <div id="v-admin" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-md">
                <h3 class="font-bold mb-4">إضافة زبون جديد</h3>
                <input type="text" id="a-name" class="w-full p-3 mb-2 bg-slate-50 border rounded-xl" placeholder="الاسم">
                <input type="tel" id="a-id" class="w-full p-3 mb-2 bg-slate-50 border rounded-xl" placeholder="رقم الهاتف">
                <input type="number" id="a-price" class="w-full p-3 mb-4 bg-slate-50 border rounded-xl" placeholder="الثمن">
                <button onclick="save()" class="w-full bg-slate-900 text-yellow-400 py-3 rounded-xl font-bold">حفظ</button>
            </div>
            <div id="admin-list" class="space-y-2"></div>
            <button onclick="exportData()" class="w-full text-xs text-slate-400 py-4">نسخ احتياطي للبيانات</button>
        </div>

        <div id="v-client" class="hidden bg-white p-8 rounded-3xl shadow-lg border border-slate-100">
            <h2 id="c-name" class="text-2xl font-black text-center mb-4 text-slate-800">--</h2>
            <div class="bg-slate-900 text-white p-6 rounded-2xl text-center mb-6 border-b-4 border-yellow-400">
                <p class="text-xs text-yellow-400 uppercase font-bold mb-1">الرصيد المطلوب</p>
                <div class="text-4xl font-black"><span id="c-due">0</span> DH</div>
            </div>
            <button onclick="location.reload()" class="w-full py-3 bg-slate-100 rounded-xl font-bold text-slate-500">خروج</button>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "0602359188";
        let clients = JSON.parse(localStorage.getItem('wifi_db')) || [];

        function login() {
            const val = document.getElementById('login-id').value.trim();
            if(val === ADMIN_PIN) {
                show('v-admin');
                renderList();
            } else {
                const u = clients.find(x => x.id === val);
                if(u) {
                    document.getElementById('c-name').innerText = u.name;
                    document.getElementById('c-due').innerText = u.price;
                    show('v-client');
                } else { alert("غير مسجل!"); }
            }
        }

        function save() {
            const n = document.getElementById('a-name').value;
            const id = document.getElementById('a-id').value;
            const p = document.getElementById('a-price').value;
            if(!n || !id || !p) return;
            clients.push({name: n, id: id, price: p});
            localStorage.setItem('wifi_db', JSON.stringify(clients));
            alert("تم الحفظ!");
            renderList();
        }

        function renderList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = clients.map(c => `
                <div class="bg-white p-4 rounded-2xl flex justify-between border">
                    <span><b>${c.name}</b> (${c.id})</span>
                    <button onclick="del('${c.id}')" class="text-red-500 text-xs">حذف</button>
                </div>
            `).join('');
        }

        function del(id) {
            clients = clients.filter(x => x.id !== id);
            localStorage.setItem('wifi_db', JSON.stringify(clients));
            renderList();
        }

        function show(id) {
            ['v-login', 'v-admin', 'v-client'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function exportData() {
            const data = JSON.stringify(clients);
            navigator.clipboard.writeText(data);
            alert("تم نسخ البيانات! احفظها في مذكراتك.");
        }
    </script>
</body>
</html>
