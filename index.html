
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal</title>
    <!-- تحميل المكتبات مع التأكد من المصدر -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .month-btn { transition: all 0.2s; border: 2px solid #e5e7eb; }
        .month-btn.active { background-color: #fbbf24; border-color: #1f2937; font-weight: bold; }
        .loader { border-top-color: #fbbf24; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- شاشة التحميل الأولية -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white">
        <div class="loader w-12 h-12 border-4 border-white rounded-full mb-4"></div>
        <p>جاري تشغيل النظام...</p>
    </div>

    <!-- التنبيهات (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] bg-black text-white px-6 py-3 rounded-full shadow-2xl hidden animate-bounce"></div>

    <header class="bg-slate-900 text-white p-6 text-center border-b-4 border-yellow-400">
        <h1 class="text-2xl font-black tracking-tighter">SMART WIFI <span class="text-yellow-400">AZILAL</span></h1>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <!-- صفحة الدخول -->
        <div id="view-login" class="bg-white rounded-3xl p-8 shadow-xl mt-10">
            <h2 class="text-center text-xl font-bold mb-6">تسجيل الدخول</h2>
            <input type="text" id="login-id" class="w-full p-4 border-2 border-gray-100 rounded-2xl mb-4 text-center focus:border-yellow-400 outline-none text-lg" placeholder="رقم التعريف">
            <button onclick="app.login()" class="w-full bg-slate-900 text-yellow-400 font-bold p-4 rounded-2xl shadow-lg active:scale-95 transition-transform">دخول</button>
        </div>

        <!-- صفحة المشترك -->
        <div id="view-client" class="hidden space-y-6">
            <div class="bg-slate-900 text-white p-8 rounded-[2.5rem] text-center shadow-2xl">
                <p class="text-xs opacity-60">مرحباً بك</p>
                <h2 id="c-name" class="text-xl font-bold my-2">---</h2>
                <div class="text-5xl font-black text-yellow-400 my-4"><span id="c-due">0</span> <small class="text-sm text-white opacity-50">د.م</small></div>
                <p class="text-xs opacity-60">مجموع المتأخرات لعام 2025</p>
            </div>
            <div class="bg-white rounded-3xl p-6 shadow-md">
                <h3 class="font-bold text-sm mb-4 border-b pb-2">سجل الاشتراكات</h3>
                <div id="c-history" class="space-y-4"></div>
            </div>
            <button onclick="location.reload()" class="w-full p-4 bg-white rounded-2xl text-gray-500 font-bold">تسجيل الخروج</button>
        </div>

        <!-- صفحة المدير -->
        <div id="view-admin" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-md">
                <h3 class="font-bold border-r-4 border-yellow-400 pr-2 mb-4">إضافة / تعديل مشترك</h3>
                <div class="space-y-3">
                    <input type="text" id="adm-name" class="w-full p-3 border rounded-xl" placeholder="الاسم الكامل">
                    <input type="text" id="adm-id" class="w-full p-3 border rounded-xl" placeholder="رقم التعريف (ID)">
                    <input type="number" id="adm-price" class="w-full p-3 border rounded-xl" placeholder="ثمن الاشتراك">
                </div>
                
                <p class="text-xs font-bold mt-4 mb-2 text-gray-500">الشهور المؤداة:</p>
                <div id="month-grid" class="grid grid-cols-3 gap-2"></div>
                
                <button onclick="app.save()" class="w-full bg-slate-900 text-yellow-400 p-4 rounded-xl font-bold mt-6 shadow-lg">حفظ البيانات</button>
                <button onclick="app.resetForm()" class="w-full text-gray-400 text-sm mt-4">إلغاء وتفريغ الحقول</button>
            </div>

            <div id="admin-list" class="space-y-3"></div>
            <button onclick="location.reload()" class="w-full p-4 text-gray-400 underline">خروج</button>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_ID = "0602359188";
        
        let db, auth, clients = [], selectedMonths = [];
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'azilal_v_final';

        window.app = {
            async init() {
                try {
                    const config = JSON.parse(__firebase_config);
                    const fireApp = initializeApp(config);
                    db = getFirestore(fireApp);
                    auth = getAuth(fireApp);

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.sync();
                            document.getElementById('loading-screen').classList.add('hidden');
                        } else {
                            signInAnonymously(auth);
                        }
                    });
                    this.renderMonths();
                } catch (e) {
                    this.showToast("خطأ في التحميل، يرجى التحديث");
                }
            },

            sync() {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'clients');
                onSnapshot(colRef, (snap) => {
                    clients = snap.docs.map(d => d.data());
                    this.renderAdminList();
                });
            },

            renderMonths() {
                const grid = document.getElementById('month-grid');
                grid.innerHTML = months.map(m => `
                    <button onclick="app.toggleMonth('${m}')" id="m-${m}" class="month-btn p-2 text-xs rounded-lg bg-gray-50 text-gray-400">
                        ${m}
                    </button>
                `).join('');
            },

            toggleMonth(m) {
                const btn = document.getElementById(`m-${m}`);
                if (selectedMonths.includes(m)) {
                    selectedMonths = selectedMonths.filter(x => x !== m);
                    btn.classList.remove('active');
                } else {
                    selectedMonths.push(m);
                    btn.classList.add('active');
                }
            },

            login() {
                const id = document.getElementById('login-id').value.trim();
                if (id === ADMIN_ID) {
                    this.show('view-admin');
                } else {
                    const c = clients.find(x => x.id === id);
                    if (c) {
                        this.renderClient(c);
                        this.show('view-client');
                    } else {
                        this.showToast("رقم التعريف غير صحيح");
                    }
                }
            },

            async save() {
                const name = document.getElementById('adm-name').value;
                const id = document.getElementById('adm-id').value;
                const price = document.getElementById('adm-price').value;

                if (!name || !id || !price) return this.showToast("أكمل البيانات");

                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id), {
                        name, id, price: Number(price), paidMonths: selectedMonths, updatedAt: Date.now()
                    });
                    this.showToast("تم الحفظ بنجاح ✅");
                    this.resetForm();
                } catch (e) {
                    this.showToast("خطأ في الحفظ");
                }
            },

            renderAdminList() {
                const list = document.getElementById('admin-list');
                list.innerHTML = clients.map(c => `
                    <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border-r-4 border-green-500">
                        <div>
                            <div class="font-bold text-sm">${c.name}</div>
                            <div class="text-xs text-gray-400">ID: ${c.id} | ${c.price} DH</div>
                        </div>
                        <div class="flex gap-3 text-xs font-bold">
                            <button onclick="app.edit('${c.id}')" class="text-blue-500">تعديل</button>
                            <button onclick="app.delete('${c.id}')" class="text-red-500">حذف</button>
                        </div>
                    </div>
                `).join('');
            },

            edit(id) {
                const c = clients.find(x => x.id === id);
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                selectedMonths = [...(c.paidMonths || [])];
                this.renderMonths();
                selectedMonths.forEach(m => document.getElementById(`m-${m}`).classList.add('active'));
                window.scrollTo(0,0);
            },

            async delete(id) {
                if (confirm("هل تريد الحذف؟")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id));
                    this.showToast("تم الحذف");
                }
            },

            renderClient(c) {
                document.getElementById('c-name').innerText = c.name;
                const curMonth = new Date().getMonth();
                const pastMonths = months.slice(0, curMonth + 1);
                const paid = c.paidMonths || [];
                const unpaid = pastMonths.filter(m => !paid.includes(m));
                
                document.getElementById('c-due').innerText = unpaid.length * c.price;
                document.getElementById('c-history').innerHTML = [...pastMonths].reverse().map(m => `
                    <div class="flex justify-between items-center text-sm">
                        <span>شهر ${m}</span>
                        <span class="${paid.includes(m) ? 'text-green-500 font-bold' : 'text-red-500'}">
                            ${paid.includes(m) ? 'تم الدفع ✓' : 'غير مؤدى ✖'}
                        </span>
                    </div>
                `).join('');
            },

            resetForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                selectedMonths = [];
                this.renderMonths();
            },

            show(id) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById('view-client').classList.add('hidden');
                document.getElementById(id).classList.remove('hidden');
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 3000);
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>

```
