<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL</title>
    <style>
        :root { --gold: #FFCC00; --dark: #111; --bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; }
        
        header { background: var(--dark); color: white; padding: 45px 20px; text-align: center; border-bottom: 8px solid var(--gold); }
        .logo-box { background: var(--gold); width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
        h1 { margin: 0; font-size: 26px; font-weight: 900; font-style: italic; }

        .container { padding: 20px; max-width: 420px; margin: -30px auto 0; position: relative; z-index: 10; }
        .card { background: white; border-radius: 25px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee; }
        
        input { width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 15px; font-size: 18px; text-align: center; font-weight: bold; margin-bottom: 15px; background: #fafafa; }
        input:focus { border-color: var(--gold); background: white; outline: none; }
        
        .btn-main { width: 100%; padding: 18px; background: var(--dark); color: var(--gold); border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-main:active { transform: scale(0.96); }

        .hidden { display: none !important; }
        
        /* User UI */
        .u-box { background: #000; color: #fff; padding: 25px; border-radius: 20px; text-align: right; border-left: 10px solid var(--gold); margin-bottom: 15px; }
        .u-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .u-stat { background: white; padding: 20px; border-radius: 20px; border: 1px solid #eee; text-align: center; }
        
        .u-history { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; text-align: right; }
        .u-row { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f8f8f8; font-size: 14px; font-weight: 600; }

        /* Connection Status */
        .sync-bar { margin-top: 20px; font-size: 11px; color: #999; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; }
        .dot { width: 8px; height: 8px; background: #ddd; border-radius: 50%; }
        .dot.online { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

        /* Admin UI */
        .m-chip { padding: 10px; border: 1.5px solid #eee; border-radius: 10px; font-size: 11px; cursor: pointer; background: #fff; color: #bbb; font-weight: bold; text-align: center; }
        .m-chip.on { background: var(--gold); border-color: var(--gold); color: black; }
        .c-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI</h1>
        <div style="color: var(--gold); font-size: 12px; font-weight: bold; letter-spacing: 2px;">AZILAL ONLINE</div>
    </header>

    <div class="container">
        <!-- Login View -->
        <div id="view-login" class="card">
            <h2 style="margin:0 0 10px">بوابة الدخول</h2>
            <p style="font-size:12px; color:#999; margin-bottom:25px">أدخل المعرف الخاص بك للاطلاع على وضعية اشتراكك</p>
            <input type="text" id="login-input" placeholder="أدخل ID الخاص بك">
            <button class="btn-main" onclick="app.login()">دخول إلى الحساب</button>
            <div class="sync-bar">
                <div id="sync-dot" class="dot"></div>
                <span id="sync-text">جاري مزامنة السحابة...</span>
            </div>
        </div>

        <!-- Subscriber View -->
        <div id="view-user" class="hidden">
            <div class="u-box">
                <div style="font-size:10px; opacity:0.6">الاسم الكامل</div>
                <h2 id="u-name-display" style="margin:0;">---</h2>
            </div>
            <div class="u-grid">
                <div class="u-stat">
                    <div style="font-size:10px; color:#aaa; margin-bottom:5px">ثمن الاشتراك</div>
                    <b id="u-price-display" style="font-size:22px">0</b> <small>درهم</small>
                </div>
                <div class="u-stat" style="border-bottom: 5px solid #e74c3c">
                    <div style="font-size:10px; color:#e74c3c; margin-bottom:5px">المتأخرات</div>
                    <b id="u-due-display" style="font-size:22px; color:#e74c3c">0</b> <small>درهم</small>
                </div>
            </div>
            <div class="u-history" id="u-history-list"></div>
            <button class="btn-main" style="margin-top:20px; background:#f0f0f0; color:#333; box-shadow:none" onclick="location.reload()">خروج</button>
        </div>

        <!-- Admin View -->
        <div id="view-admin" class="hidden">
            <div class="card" style="text-align:right; margin-bottom:15px; padding:20px;">
                <h3 style="margin-top:0">إضافة زبون جديد</h3>
                <input type="text" id="adm-n" placeholder="الاسم الكامل" style="font-size:14px; padding:12px">
                <input type="text" id="adm-i" placeholder="المعرف (ID)" style="font-size:14px; padding:12px">
                <input type="number" id="adm-p" placeholder="ثمن الاشتراك" style="font-size:14px; padding:12px">
                <p style="font-size:11px; font-weight:bold; color:#666">تحديد الأشهر المؤداة:</p>
                <div id="adm-months-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin-bottom:15px"></div>
                <button class="btn-main" onclick="app.saveData()">حفظ البيانات سحابياً</button>
            </div>
            <div id="adm-clients-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // إعدادات ثابتة للجميع
        const ADMIN_CODE = "0602359188";
        const APP_ID = "wifi-azilal-v100";
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        let db, clients = [], selectedMonths = [];

        const app = {
            async start() {
                try {
                    // استخدام الإعدادات المباشرة لضمان المزامنة عند الكل
                    const config = JSON.parse(__firebase_config);
                    const fb = initializeApp(config);
                    db = getFirestore(fb);
                    const auth = getAuth(fb);
                    await signInAnonymously(auth);
                    
                    document.getElementById('sync-dot').classList.add('online');
                    document.getElementById('sync-text').innerText = "متصل بالسحابة ✓";

                    // المزامنة الحية: أي تغيير تقوم به سيظهر عند المشترك فوراً
                    onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'clients'), (snap) => {
                        clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        this.renderAdmin();
                    });
                } catch (e) {
                    document.getElementById('sync-text').innerText = "العمل في وضع الأوفلاين";
                }
            },

            login() {
                const val = document.getElementById('login-input').value.trim();
                if (!val) return;

                if (val === ADMIN_CODE) {
                    this.switchView('view-admin');
                    this.initMonthsUI();
                    return;
                }

                const u = clients.find(c => String(c.id).toLowerCase() === val.toLowerCase());
                if (u) {
                    this.switchView('view-user');
                    document.getElementById('u-name-display').innerText = u.name;
                    document.getElementById('u-price-display').innerText = u.price;
                    const dueCount = months.length - u.paid.length;
                    document.getElementById('u-due-display').innerText = (dueCount * u.price);
                    
                    let html = '<div style="padding:15px; background:#fafafa; font-weight:bold; font-size:12px; border-bottom:1px solid #eee">وضعية الأداء 2026</div>';
                    months.forEach(m => {
                        const isPaid = u.paid.includes(m);
                        html += `<div class="u-row"><span>${m}</span><span style="color:${isPaid?'#2ecc71':'#e74c3c'}">${isPaid?'مؤدى ✓':'غير مؤدى'}</span></div>`;
                    });
                    document.getElementById('u-history-list').innerHTML = html;
                } else {
                    alert("عذراً، المعرف غير موجود في قاعدة البيانات.");
                }
            },

            switchView(id) {
                ['view-login', 'view-user', 'view-admin'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            },

            initMonthsUI() {
                const grid = document.getElementById('adm-months-grid');
                grid.innerHTML = "";
                months.forEach(m => {
                    const b = document.createElement('div');
                    b.className = "m-chip"; b.innerText = m;
                    b.onclick = () => {
                        if (selectedMonths.includes(m)) {
                            selectedMonths = selectedMonths.filter(x => x !== m);
                            b.classList.remove('on');
                        } else {
                            selectedMonths.push(m);
                            b.classList.add('on');
                        }
                    };
                    grid.appendChild(b);
                });
            },

            async saveData() {
                const n = document.getElementById('adm-n').value.trim();
                const i = document.getElementById('adm-i').value.trim();
                const p = document.getElementById('adm-p').value || 200;
                if (!n || !i) return alert("المرجو ملء جميع الخانات");

                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'clients', i), {
                        name: n, price: Number(p), paid: selectedMonths
                    });
                    alert("تم الحفظ والمزامنة بنجاح!");
                    location.reload();
                } catch (e) {
                    alert("فشل في الاتصال بالسحابة.");
                }
            },

            renderAdmin() {
                const list = document.getElementById('adm-clients-list');
                if(!list) return;
                list.innerHTML = "<p style='font-size:11px; font-weight:bold; color:#aaa; margin:20px 10px 10px'>قائمة المشتركين الحالية:</p>";
                clients.forEach(c => {
                    const d = document.createElement('div');
                    d.className = "c-item";
                    d.innerHTML = `<div style="text-align:right"><b>${c.name}</b><br><small style="color:#aaa">ID: ${c.id}</small></div>`;
                    const del = document.createElement('button');
                    del.innerText = "حذف"; del.style = "color:red; border:none; background:none; font-weight:bold";
                    del.onclick = async () => {
                        if(confirm("هل تريد حذف هذا الزبون؟")) {
                            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'clients', c.id));
                        }
                    };
                    d.appendChild(del);
                    list.appendChild(d);
                });
            }
        };

        window.app = app;
        window.onload = () => app.start();
    </script>
</body>
</html>

```
