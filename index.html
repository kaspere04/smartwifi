<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL - الإصدار المصلح</title>
    <style>
        :root {
            --gold: #FFCC00;
            --dark: #111;
            --bg: #f4f7f6;
            --red: #e74c3c;
            --green: #2ecc71;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        header { background: var(--dark); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .logo-box { background: var(--gold); width: 45px; height: 45px; margin: 0 auto 10px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        h1 { margin: 0; font-size: 20px; text-transform: uppercase; }

        .container { padding: 15px; max-width: 480px; margin: 0 auto; }
        
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; margin-top: -20px; position: relative; z-index: 10; border: 1px solid #eee; }
        
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 12px; }
        
        .btn-main { width: 100%; padding: 14px; background: var(--dark); color: var(--gold); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-main:active { opacity: 0.8; }

        .hidden { display: none !important; }

        .u-card { background: var(--dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-right: 6px solid var(--gold); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .grid-item { background: white; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #eee; }
        .grid-item b { font-size: 20px; display: block; }

        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 15px 0; }
        .m-btn { padding: 10px 2px; border: 1px solid #eee; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fff; text-align: center; color: #666; }
        .m-btn.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }

        .client-item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .edit-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; }
        .del-btn { color: var(--red); background: none; border: none; font-size: 11px; margin-right: 8px; }

        #history-list { margin-top: 15px; background: white; border-radius: 15px; border: 1px solid #eee; overflow: hidden; }
        .hist-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        .badge { padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        .badge-paid { background: #e8f5e9; color: var(--green); }
        .badge-unpaid { background: #ffebee; color: var(--red); }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI AZILAL</h1>
    </header>

    <div class="container">
        <!-- View: Login -->
        <div id="view-login" class="card">
            <h3 style="margin-top:0; text-align:center">دخول الحساب</h3>
            <input type="text" id="login-id" placeholder="أدخل رقم التعريف">
            <button class="btn-main" onclick="app.login()">دخول</button>
        </div>

        <!-- View: User Info -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <small>الزبون:</small>
                <h2 id="u-name" style="margin:2px 0">---</h2>
                <small id="u-year-info">سنة الاستهلاك 2025</small>
            </div>
            
            <div class="grid">
                <div class="grid-item"><small>الاشتراك</small><b id="u-price">0</b><small>درهم</small></div>
                <div class="grid-item"><small>الباقي</small><b id="u-due" style="color:var(--red)">0</b><small>درهم</small></div>
            </div>

            <div id="history-list"></div>
            <button class="btn-main" style="margin-top:15px; background:#eee; color:#333" onclick="location.reload()">خروج</button>
        </div>

        <!-- View: Admin Control -->
        <div id="view-admin" class="hidden">
            <div class="card">
                <h3 style="margin:0 0 15px 0">إضافة/تعديل زبون</h3>
                <input type="text" id="adm-name" placeholder="الاسم الكامل">
                <input type="text" id="adm-id" placeholder="رقم التعريف (ID)">
                <input type="number" id="adm-price" placeholder="ثمن الاشتراك الشهري">
                
                <p style="font-size:13px; margin:10px 0 5px; font-weight:bold">حدد الأشهر المسددة:</p>
                <div class="m-grid" id="month-grid"></div>
                
                <button class="btn-main" id="btn-save" onclick="app.saveClient()">حفظ التغييرات</button>
                <button class="btn-main" style="background:#eee; color:#333; font-size:13px" onclick="app.clearForm()">+ تنظيف الحقول</button>
            </div>
            <div id="admin-clients-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_ID = "0602359188";
        const COLLECTION_NAME = "wifi_azilal_v3";

        let db, clients = [], activePaidMonths = [];

        const app = {
            async init() {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const fbApp = initializeApp(firebaseConfig);
                    db = getFirestore(fbApp);
                    const auth = getAuth(fbApp);
                    await signInAnonymously(auth);

                    // رسم الشبكة فوراً قبل أي شيء
                    this.drawMonthGrid();

                    // متابعة قاعدة البيانات
                    onSnapshot(collection(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME), (snap) => {
                        clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        this.renderAdminList();
                    });
                } catch (e) {
                    console.error("Firebase Init Error:", e);
                }
            },

            drawMonthGrid() {
                const grid = document.getElementById('month-grid');
                if (!grid) return;
                grid.innerHTML = '';
                months.forEach(m => {
                    const btn = document.createElement('div');
                    btn.className = 'm-btn';
                    // التحقق من الحالة
                    if (activePaidMonths.includes(m)) btn.classList.add('active');
                    btn.innerText = m;
                    btn.onclick = () => {
                        if (activePaidMonths.includes(m)) {
                            activePaidMonths = activePaidMonths.filter(x => x !== m);
                            btn.classList.remove('active');
                        } else {
                            activePaidMonths.push(m);
                            btn.classList.add('active');
                        }
                        console.log("Selected Months:", activePaidMonths);
                    };
                    grid.appendChild(btn);
                });
            },

            login() {
                const id = document.getElementById('login-id').value.trim();
                if(id === ADMIN_ID) {
                    this.switchView('view-admin');
                    this.drawMonthGrid();
                    return;
                }
                const user = clients.find(c => String(c.id) === String(id));
                if(user) {
                    this.switchView('view-user');
                    this.renderUser(user);
                } else if(id) {
                    alert("الرقم غير مسجل");
                }
            },

            switchView(id) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-user').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById(id).classList.remove('hidden');
            },

            async saveClient() {
                const name = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const price = document.getElementById('adm-price').value;

                if(!name || !id || !price) return alert("الرجاء إدخال الاسم، الرقم، والثمن");

                const btn = document.getElementById('btn-save');
                btn.innerText = "جاري الحفظ...";
                btn.disabled = true;

                try {
                    // حفظ البيانات في المسار الصحيح
                    await setDoc(doc(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME, id), {
                        name: name,
                        id: id,
                        price: Number(price),
                        paid: activePaidMonths,
                        lastUpdate: new Date().getTime()
                    });
                    alert("تم الحفظ بنجاح!");
                    this.clearForm();
                } catch (e) {
                    console.error("Save Error:", e);
                    alert("فشل الحفظ، تحقق من الاتصال");
                } finally {
                    btn.innerText = "حفظ التغييرات";
                    btn.disabled = false;
                }
            },

            clearForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                activePaidMonths = [];
                this.drawMonthGrid();
            },

            renderAdminList() {
                const list = document.getElementById('admin-clients-list');
                if(!list) return;
                list.innerHTML = '<p style="font-size:12px; margin-top:15px; color:#666">الزبناء المسجلون:</p>';
                clients.sort((a,b) => b.lastUpdate - a.lastUpdate).forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'client-item';
                    div.innerHTML = `
                        <div><b>${c.name}</b><br><small>${c.id}</small></div>
                        <div>
                            <button class="edit-btn" onclick="app.edit('${c.id}')">تعديل</button>
                            <button class="del-btn" onclick="app.remove('${c.id}')">حذف</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            edit(id) {
                const c = clients.find(x => String(x.id) === String(id));
                if (!c) return;
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                activePaidMonths = Array.isArray(c.paid) ? [...c.paid] : [];
                this.drawMonthGrid();
                window.scrollTo({top: 0, behavior: 'smooth'});
            },

            async remove(id) {
                if(confirm("هل تريد حذف هذا الزبون نهائياً؟")) {
                    await deleteDoc(doc(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME, id));
                }
            },

            renderUser(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price;
                
                const currentMonthIdx = new Date().getMonth();
                const pastMonths = months.slice(0, currentMonthIdx + 1);
                const paidData = Array.isArray(u.paid) ? u.paid : [];
                
                const unpaidCount = pastMonths.filter(m => !paidData.includes(m)).length;
                document.getElementById('u-due').innerText = unpaidCount * u.price;

                const list = document.getElementById('history-list');
                list.innerHTML = '';
                pastMonths.reverse().forEach(m => {
                    const isPaid = paidData.includes(m);
                    const row = document.createElement('div');
                    row.className = 'hist-row';
                    row.innerHTML = `
                        <span>شهر ${m}</span>
                        <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">
                            ${isPaid ? 'تم الأداء ✓' : 'لم يؤدى'}
                        </span>
                    `;
                    list.appendChild(row);
                });
            }
        };

        // التشغيل
        window.onload = () => app.init();
        window.app = app;
    </script>
</body>
</html>
