<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; overflow-x: hidden; }
        .bg-smart-yellow { background-color: #ffcc00; }
        .text-smart-yellow { color: #ffcc00; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input, button { -webkit-appearance: none; border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="bg-black text-white py-8 border-b-8 border-smart-yellow text-center shadow-xl">
        <div class="inline-block p-4 bg-smart-yellow rounded-2xl mb-3 shadow-lg transform rotate-2">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </div>
        <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none">SMART WIFI</h1>
        <div class="inline-block bg-smart-yellow text-black px-4 py-1 text-3xl font-black italic mt-1 rounded-lg">AZILAL</div>
    </header>

    <main class="max-w-md mx-auto px-6 -mt-6">
        
        <!-- Status Box -->
        <div id="status-box" class="bg-white p-4 rounded-2xl shadow-lg flex items-center justify-center gap-3 mb-6 border border-slate-100">
            <div id="loader-icon" class="loader"></div>
            <span id="status-text" class="text-xs font-bold text-slate-500">جاري الاتصال...</span>
        </div>

        <!-- Login View -->
        <div id="login-view" class="bg-white rounded-[2rem] shadow-2xl p-8 hidden">
            <h2 class="text-xl font-black text-center text-slate-800 mb-6">بوابة الدخول</h2>
            <div class="space-y-4">
                <input type="text" id="login-id" placeholder="رقم المعرف الخاص بك" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-slate-100 focus:border-smart-yellow outline-none text-center font-bold text-lg">
                <button onclick="handleLogin()" class="w-full bg-black text-smart-yellow font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
                    <span>دخول</span>
                </button>
            </div>
        </div>

        <!-- Client View -->
        <div id="client-view" class="hidden space-y-4">
            <div class="bg-black text-white p-6 rounded-[2rem] shadow-xl relative">
                <p class="text-smart-yellow text-[10px] font-bold uppercase mb-1">المشترك</p>
                <h3 id="c-name" class="text-2xl font-black">---</h3>
                <button onclick="location.reload()" class="absolute top-4 left-4 text-white/50 text-xs">خروج</button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl border text-center">
                    <p class="text-[9px] text-slate-400 font-bold mb-1 uppercase">الثمن</p>
                    <span id="c-price" class="font-black text-lg">0</span>
                </div>
                <div class="bg-red-600 text-white p-4 rounded-2xl text-center shadow-lg shadow-red-100">
                    <p class="text-white/50 text-[9px] font-bold mb-1 uppercase">الباقي</p>
                    <span id="c-due" class="font-black text-lg">0</span>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-lg border border-slate-50 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b font-bold text-xs">سجل الدفعات 2026</div>
                <div id="m-list" class="divide-y"></div>
            </div>
        </div>

        <!-- Admin View -->
        <div id="admin-view" class="hidden space-y-4">
            <div class="bg-smart-yellow p-6 rounded-2xl font-black italic">لوحة الإدارة السحابية</div>
            <div class="bg-white p-6 rounded-2xl shadow-xl space-y-3">
                <input type="text" id="adm-name" placeholder="الاسم" class="w-full p-3 bg-slate-50 rounded-lg border font-bold">
                <input type="text" id="adm-id" placeholder="ID" class="w-full p-3 bg-slate-50 rounded-lg border font-bold">
                <div id="adm-months-grid" class="grid grid-cols-3 gap-1 py-2"></div>
                <button onclick="saveToCloud()" id="save-btn" class="w-full bg-black text-smart-yellow font-black py-4 rounded-xl shadow-lg">حفظ في السحاب</button>
            </div>
            <div id="adm-list" class="space-y-2"></div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // الروابط البرمجية (Environment Config)
        const fCfg = JSON.parse(__firebase_config);
        const app = initializeApp(fCfg);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const aId = typeof __app_id !== 'undefined' ? __app_id : 'smartwifi-cloud';

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        let selPaid = [];
        let clients = [];

        // تشغيل النظام
        async function run() {
            try {
                await signInAnonymously(auth);
                document.getElementById('loader-icon').classList.add('hidden');
                document.getElementById('status-text').innerText = "متصل بالسحاب ✓";
                document.getElementById('login-view').classList.remove('hidden');
                
                initGrid();
                const col = collection(db, 'artifacts', aId, 'public', 'data', 'clients');
                onSnapshot(col, (s) => {
                    clients = s.docs.map(d => ({id: d.id, ...d.data()}));
                    renderList();
                });
            } catch(e) {
                document.getElementById('status-text').innerText = "خطأ في الاتصال";
            }
        }

        function initGrid() {
            const g = document.getElementById('adm-months-grid');
            months.forEach(m => {
                const b = document.createElement('button');
                b.innerText = m;
                b.className = "p-1 text-[9px] font-bold border rounded bg-white text-slate-300";
                b.onclick = () => {
                    if(selPaid.includes(m)) {
                        selPaid = selPaid.filter(x => x !== m);
                        b.classList.remove('bg-green-500', 'text-white');
                    } else {
                        selPaid.push(m);
                        b.classList.add('bg-green-500', 'text-white');
                    }
                };
                g.appendChild(b);
            });
        }

        window.handleLogin = () => {
            const val = document.getElementById('login-id').value.trim();
            if(val === "0602359188") {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                return;
            }
            const u = clients.find(c => c.id === val);
            if(u) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('status-box').classList.add('hidden');
                document.getElementById('client-view').classList.remove('hidden');
                document.getElementById('c-name').innerText = u.name;
                document.getElementById('c-price').innerText = u.price + " د";
                const d = (months.length - u.paid.length) * u.price;
                document.getElementById('c-due').innerText = d + " د";
                
                const list = document.getElementById('m-list');
                list.innerHTML = "";
                months.forEach(m => {
                    const ok = u.paid.includes(m);
                    list.innerHTML += `<div class="flex justify-between p-4 text-xs font-bold">
                        <span>${m}</span>
                        <span class="${ok ? 'text-green-600' : 'text-red-500'}">${ok ? 'تم الأداء' : 'غير مؤدى'}</span>
                    </div>`;
                });
            } else { alert("المعرف غير موجود"); }
        };

        window.saveToCloud = async () => {
            const n = document.getElementById('adm-name').value;
            const i = document.getElementById('adm-id').value;
            if(!n || !i) return alert("أدخل البيانات");
            const btn = document.getElementById('save-btn');
            btn.innerText = "جاري الحفظ...";
            try {
                await setDoc(doc(db, 'artifacts', aId, 'public', 'data', 'clients', i), {
                    name: n, price: 200, paid: [...selPaid]
                });
                alert("تم الحفظ!");
                location.reload();
            } catch(e) { alert("خطأ!"); }
        };

        function renderList() {
            const l = document.getElementById('adm-list');
            l.innerHTML = "";
            clients.forEach(c => {
                const d = document.createElement('div');
                d.className = "bg-white p-3 rounded-xl border flex justify-between items-center text-sm font-bold shadow-sm";
                d.innerHTML = `<span>${c.name}</span><button class="text-red-500 text-xs">حذف</button>`;
                d.querySelector('button').onclick = async () => {
                    if(confirm("حذف؟")) await deleteDoc(doc(db, 'artifacts', aId, 'public', 'data', 'clients', c.id));
                };
                l.appendChild(d);
            });
        }

        run();
    </script>
</body>
</html>

```
