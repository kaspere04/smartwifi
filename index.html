<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal | 2024-2036</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .year-btn { transition: all 0.2s; border: 1px solid #e2e8f0; }
        .year-btn.active { background-color: #1e293b; color: #fbbf24; border-color: #fbbf24; font-weight: bold; transform: scale(1.05); }
        .month-btn { transition: all 0.2s; border: 1px solid #e2e8f0; }
        .month-btn.active { background-color: #fbbf24; color: #1e293b; border-color: #1e293b; font-weight: bold; }
        .hidden { display: none !important; }
        .loader { border-top-color: #fbbf24; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white p-6">
        <div class="loader w-12 h-12 border-4 border-white/20 rounded-full mb-4"></div>
        <p id="loading-msg">جاري تحميل البيانات...</p>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 text-white p-6 text-center border-b-4 border-yellow-400 shadow-xl">
        <h1 class="text-2xl font-black tracking-tighter italic">SMART WIFI <span class="text-yellow-400">AZILAL</span></h1>
    </header>

    <main class="max-w-md mx-auto p-4 pb-20">
        
        <!-- Login View -->
        <div id="view-login" class="bg-white rounded-[2.5rem] p-8 shadow-2xl mt-10 border border-slate-100">
            <h2 class="text-center text-xl font-bold mb-8 text-slate-700">دخول النظام</h2>
            <input type="text" id="login-id" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-4 text-center text-xl focus:border-yellow-400 outline-none transition-all" placeholder="رقم التعريف">
            <button onclick="app.login()" class="w-full bg-slate-900 text-yellow-400 font-bold p-4 rounded-2xl shadow-lg active:scale-95 transition-transform">دخول</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="view-admin" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-lg border border-slate-100">
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="w-2 h-6 bg-yellow-400 rounded-full"></span>
                    إدارة المشتركين
                </h3>
                
                <div class="space-y-3">
                    <input type="text" id="adm-name" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="الاسم الكامل">
                    <input type="text" id="adm-id" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="رقم التعريف">
                    <input type="number" id="adm-price" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="ثمن الاشتراك (درهم)">
                </div>

                <!-- Year Selection Area -->
                <div class="mt-6">
                    <p class="text-xs font-bold text-slate-400 mb-2">اختر السنة أولاً:</p>
                    <div id="year-grid" class="grid grid-cols-4 gap-2">
                        <!-- Years 2024 to 2036 will be injected here -->
                    </div>
                </div>

                <!-- Month Selection Area (Dynamic) -->
                <div id="month-section" class="mt-4 hidden">
                    <p class="text-xs font-bold text-slate-400 mb-2">تحديد شهور سنة <span id="selected-year-label" class="text-slate-900"></span> المؤداة:</p>
                    <div id="month-grid" class="grid grid-cols-3 gap-2">
                        <!-- Months will be injected here -->
                    </div>
                </div>

                <button onclick="app.save()" class="w-full bg-slate-900 text-yellow-400 p-4 rounded-2xl font-bold mt-8 shadow-md active:scale-95 transition-all">حفظ البيانات</button>
                <button onclick="app.resetForm()" class="w-full text-slate-400 text-sm mt-4">تفريغ الخانات</button>
            </div>

            <div id="admin-list" class="space-y-3"></div>
            <button onclick="location.reload()" class="w-full p-4 text-slate-400 underline">خروج</button>
        </div>

        <!-- Client Dashboard -->
        <div id="view-client" class="hidden space-y-6">
            <div class="bg-slate-900 text-white p-8 rounded-[3rem] text-center shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs opacity-50 mb-1">مرحباً بك</p>
                    <h2 id="c-name" class="text-2xl font-bold mb-4">---</h2>
                    <div class="bg-white/5 py-4 rounded-3xl border border-white/10">
                        <p class="text-[10px] opacity-40 uppercase tracking-widest">إجمالي المتأخرات (كل السنوات)</p>
                        <div class="text-5xl font-black text-yellow-400 mt-1"><span id="c-total-due">0</span> <small class="text-lg">د.م</small></div>
                    </div>
                </div>
                <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-yellow-400/10 rounded-full blur-3xl"></div>
            </div>

            <div id="client-years-area" class="space-y-4">
                <!-- User's payment history per year will be here -->
            </div>

            <button onclick="location.reload()" class="w-full p-4 bg-white text-slate-400 font-bold rounded-2xl shadow-sm">تسجيل الخروج</button>
        </div>

    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl hidden z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const years = Array.from({length: 13}, (_, i) => 2024 + i);
        const ADMIN_ID = "0602359188";
        
        let db, auth, clients = [], currentYear = null, editingClientPayments = {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'azilal_v_ultimate';

        const app = {
            async init() {
                try {
                    const config = JSON.parse(__firebase_config);
                    const fireApp = initializeApp(config);
                    db = getFirestore(fireApp);
                    auth = getAuth(fireApp);

                    onAuthStateChanged(auth, (user) => {
                        if (user) this.sync();
                        else signInAnonymously(auth);
                    });
                } catch (e) {
                    document.getElementById('loading-msg').innerText = "خطأ في الاتصال، يرجى إعادة المحاولة";
                }
            },

            sync() {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'clients');
                onSnapshot(colRef, (snap) => {
                    clients = snap.docs.map(d => d.data());
                    this.renderAdminList();
                    document.getElementById('loading-screen').classList.add('hidden');
                });
            },

            renderYearGrid() {
                const grid = document.getElementById('year-grid');
                grid.innerHTML = years.map(y => `
                    <button onclick="app.selectYear(${y})" id="yr-${y}" class="year-btn p-2 text-sm rounded-xl bg-white shadow-sm">
                        ${y}
                    </button>
                `).join('');
            },

            selectYear(y) {
                currentYear = y;
                document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`yr-${y}`).classList.add('active');
                
                document.getElementById('selected-year-label').innerText = y;
                document.getElementById('month-section').classList.remove('hidden');
                this.renderMonthGrid();
            },

            renderMonthGrid() {
                const grid = document.getElementById('month-grid');
                const paidInCurrentYear = editingClientPayments[currentYear] || [];
                
                grid.innerHTML = months.map(m => `
                    <button onclick="app.toggleMonth('${m}')" id="m-${m}" class="month-btn p-3 text-xs rounded-xl ${paidInCurrentYear.includes(m) ? 'active' : 'bg-slate-50'}">
                        ${m}
                    </button>
                `).join('');
            },

            toggleMonth(m) {
                if (!editingClientPayments[currentYear]) editingClientPayments[currentYear] = [];
                
                if (editingClientPayments[currentYear].includes(m)) {
                    editingClientPayments[currentYear] = editingClientPayments[currentYear].filter(x => x !== m);
                    document.getElementById(`m-${m}`).classList.remove('active');
                    document.getElementById(`m-${m}`).classList.add('bg-slate-50');
                } else {
                    editingClientPayments[currentYear].push(m);
                    document.getElementById(`m-${m}`).classList.add('active');
                    document.getElementById(`m-${m}`).classList.remove('bg-slate-50');
                }
            },

            login() {
                const id = document.getElementById('login-id').value.trim();
                if (id === ADMIN_ID) {
                    this.switchView('view-admin');
                    this.renderYearGrid();
                } else {
                    const c = clients.find(x => x.id === id);
                    if (c) {
                        this.renderClientDashboard(c);
                        this.switchView('view-client');
                    } else {
                        this.toast("عذراً، رقم التعريف غير موجود");
                    }
                }
            },

            async save() {
                const name = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const price = document.getElementById('adm-price').value;

                if (!name || !id || !price) return this.toast("أكمل جميع البيانات");

                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id), {
                        name, id, price: Number(price),
                        payments: editingClientPayments,
                        updatedAt: Date.now()
                    });
                    this.toast("تم الحفظ بنجاح ✅");
                    this.resetForm();
                } catch (e) {
                    this.toast("حدث خطأ أثناء الحفظ");
                }
            },

            renderAdminList() {
                const list = document.getElementById('admin-list');
                list.innerHTML = `<p class="text-xs text-slate-400 mr-2 mb-2">قائمة المشتركين (${clients.length})</p>` + 
                clients.map(c => `
                    <div class="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-slate-100">
                        <div onclick="app.edit('${c.id}')" class="flex-1 cursor-pointer">
                            <div class="font-bold text-slate-700">${c.name}</div>
                            <div class="text-[10px] text-slate-400">ID: ${c.id} • ${c.price} درهم</div>
                        </div>
                        <button onclick="app.delete('${c.id}')" class="p-2 text-red-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                `).join('');
            },

            edit(id) {
                const c = clients.find(x => x.id === id);
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                editingClientPayments = c.payments || {};
                this.renderYearGrid();
                document.getElementById('month-section').classList.add('hidden');
                window.scrollTo({top: 0, behavior: 'smooth'});
            },

            async delete(id) {
                if (confirm("حذف هذا المشترك؟")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id));
                    this.toast("تم الحذف");
                }
            },

            renderClientDashboard(c) {
                document.getElementById('c-name').innerText = c.name;
                const area = document.getElementById('client-years-area');
                area.innerHTML = '';
                
                let totalDue = 0;
                const now = new Date();
                const thisYear = now.getFullYear();
                const thisMonthIdx = now.getMonth();

                // عرض السنوات من 2024 إلى السنة الحالية فقط للزبون
                const relevantYears = years.filter(y => y <= thisYear);

                relevantYears.reverse().forEach(y => {
                    const paid = (c.payments && c.payments[y]) ? c.payments[y] : [];
                    // تحديد الشهور التي يجب أن تكون مدفوعة حتى الآن
                    const targetMonths = (y < thisYear) ? months : months.slice(0, thisMonthIdx + 1);
                    const unpaid = targetMonths.filter(m => !paid.includes(m));
                    
                    totalDue += (unpaid.length * c.price);

                    if (targetMonths.length > 0) {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-3xl p-6 shadow-sm border border-slate-100";
                        card.innerHTML = `
                            <div class="flex justify-between items-center mb-4 border-b pb-2">
                                <h4 class="font-black text-slate-800">سنة ${y}</h4>
                                <span class="text-xs ${unpaid.length === 0 ? 'text-green-500' : 'text-red-500'} font-bold">
                                    ${unpaid.length === 0 ? 'خالص' : 'باقي ' + (unpaid.length * c.price) + ' درهم'}
                                </span>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                ${targetMonths.map(m => `
                                    <div class="text-[10px] p-2 text-center rounded-lg ${paid.includes(m) ? 'bg-green-50 text-green-600 font-bold border border-green-100' : 'bg-red-50 text-red-400 border border-red-100'}">
                                        ${m}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        area.appendChild(card);
                    }
                });

                document.getElementById('c-total-due').innerText = totalDue;
            },

            resetForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                editingClientPayments = {};
                currentYear = null;
                document.getElementById('month-section').classList.add('hidden');
                this.renderYearGrid();
            },

            switchView(id) {
                ['view-login', 'view-admin', 'view-client'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            },

            toast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 3000);
            }
        };

        window.app = app;
        app.init();
    </script>
</body>
</html>

```
