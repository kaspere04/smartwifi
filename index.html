<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal - الإصدار المصلح</title>
    <style>
        :root { --gold: #FFCC00; --dark: #111; --bg: #f8f9fa; --red: #e74c3c; --green: #2ecc71; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; outline: none; }
        .btn-main { width: 100%; padding: 14px; background: var(--dark); color: var(--gold); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
        .hidden { display: none !important; }
        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
        .m-btn { padding: 10px 2px; border: 1px solid #eee; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fff; text-align: center; color: #666; }
        .m-btn.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--dark); }
        .u-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-right: 5px solid var(--gold); }
        .client-item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        #history-list { background: white; border-radius: 12px; border: 1px solid #eee; overflow: hidden; margin-top: 15px; }
        .hist-row { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #f9f9f9; font-size: 13px; }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .badge-paid { background: #e8f5e9; color: var(--green); }
        .badge-unpaid { background: #ffebee; color: var(--red); }
        #connection-status { font-size: 10px; text-align: center; margin-top: 5px; color: #888; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0">SMART WIFI <span style="color:var(--gold)">AZILAL</span></h2>
        <div id="connection-status">جاري الاتصال بالسيرفر...</div>
    </header>

    <div class="container">
        <!-- صفحة الدخول -->
        <div id="view-login" class="card">
            <h3 style="text-align:center; margin-top:0">تسجيل الدخول</h3>
            <input type="text" id="login-id" placeholder="أدخل رقم التعريف">
            <button class="btn-main" id="btn-login" onclick="app.login()" disabled>يرجى الانتظار...</button>
        </div>

        <!-- صفحة الزبون -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <small>حساب الزبون:</small>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <small>تتبع استهلاك سنة 2025</small>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                <div class="card" style="margin:0; text-align:center; padding:10px"><small>الاشتراك</small><br><b id="u-price">0</b><small> د.م</small></div>
                <div class="card" style="margin:0; text-align:center; padding:10px"><small>المتأخرات</small><br><b id="u-due" style="color:var(--red)">0</b><small> د.م</small></div>
            </div>
            <div id="history-list"></div>
            <button class="btn-main" style="margin-top:20px; background:#ddd; color:#333" onclick="location.reload()">خروج</button>
        </div>

        <!-- صفحة المدير -->
        <div id="view-admin" class="hidden">
            <div class="card">
                <h3 style="margin-top:0">إدارة النظام</h3>
                <input type="text" id="adm-name" placeholder="الاسم الكامل للزبون">
                <input type="text" id="adm-id" placeholder="رقم التعريف (ID)">
                <input type="number" id="adm-price" placeholder="ثمن الاشتراك (درهم)">
                <p style="font-size:12px; font-weight:bold; margin:5px 0">حدد الأشهر التي تم دفعها:</p>
                <div class="m-grid" id="month-grid"></div>
                <button class="btn-main" id="btn-save" onclick="app.saveClient()">حفظ البيانات</button>
                <button class="btn-main" style="margin-top:8px; background:#eee; color:#444; font-size:12px" onclick="app.clearForm()">+ إضافة زبون جديد</button>
            </div>
            <div id="admin-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_ID = "0602359188";
        
        let db, auth, user, clients = [], activeMonths = [];
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'smart-wifi-azilal-v20';

        const app = {
            async init() {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const fbApp = initializeApp(firebaseConfig);
                    db = getFirestore(fbApp);
                    auth = getAuth(fbApp);

                    // القاعدة 3: تسجيل الدخول أولاً قبل أي عملية
                    const initAuth = async () => {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    };

                    initAuth();

                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            user = u;
                            document.getElementById('connection-status').innerText = "متصل بنجاح ✅";
                            document.getElementById('btn-login').disabled = false;
                            document.getElementById('btn-login').innerText = "دخول";
                            this.startSync();
                        }
                    });

                    this.drawGrid();
                } catch (e) {
                    console.error("Initialization failed", e);
                    document.getElementById('connection-status').innerText = "فشل في الاتصال ❌";
                }
            },

            startSync() {
                // القاعدة 1: المسار الصارم المسموح به
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'clients');
                onSnapshot(colRef, (snap) => {
                    clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    this.renderAdminList();
                }, (err) => {
                    console.error("Sync error:", err);
                });
            },

            drawGrid() {
                const grid = document.getElementById('month-grid');
                grid.innerHTML = '';
                months.forEach(m => {
                    const btn = document.createElement('div');
                    btn.className = 'm-btn' + (activeMonths.includes(m) ? ' active' : '');
                    btn.innerText = m;
                    btn.onclick = () => {
                        if (activeMonths.includes(m)) activeMonths = activeMonths.filter(x => x !== m);
                        else activeMonths.push(m);
                        this.drawGrid();
                    };
                    grid.appendChild(btn);
                });
            },

            login() {
                const val = document.getElementById('login-id').value.trim();
                if (!val) return;
                
                if (val === ADMIN_ID) {
                    this.switchView('view-admin');
                } else {
                    const found = clients.find(c => String(c.id) === val);
                    if (found) {
                        this.switchView('view-user');
                        this.renderUserView(found);
                    } else {
                        alert("رقم التعريف غير موجود في السجل");
                    }
                }
            },

            switchView(id) {
                ['view-login', 'view-admin', 'view-user'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            },

            async saveClient() {
                if (!user) return alert("بانتظار المصادقة...");
                
                const name = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const price = document.getElementById('adm-price').value;

                if (!name || !id || !price) return alert("الرجاء إدخال جميع المعلومات");

                const btn = document.getElementById('btn-save');
                btn.disabled = true;
                btn.innerText = "جاري الحفظ...";

                try {
                    // القاعدة 1: مسار الحفظ الصارم
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'clients', id);
                    await setDoc(docRef, {
                        name, id, price: Number(price),
                        paid: activeMonths,
                        updatedAt: Date.now()
                    });
                    alert("تم الحفظ بنجاح!");
                    this.clearForm();
                } catch (e) {
                    alert("خطأ أثناء الحفظ: " + e.message);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "حفظ البيانات";
                }
            },

            renderAdminList() {
                const list = document.getElementById('admin-list');
                if (!list) return;
                list.innerHTML = '<p style="font-size:11px; color:#999; margin-top:20px">قائمة الزبناء المسجلين:</p>';
                clients.sort((a,b) => b.updatedAt - a.updatedAt).forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'client-item';
                    div.innerHTML = `
                        <div><b>${c.name}</b><br><small>ID: ${c.id}</small></div>
                        <div style="display:flex; gap:10px">
                            <button onclick="app.edit('${c.id}')" style="background:none; border:none; color:blue; font-size:12px">تعديل</button>
                            <button onclick="app.delete('${c.id}')" style="background:none; border:none; color:red; font-size:12px">حذف</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            edit(id) {
                const c = clients.find(x => x.id === id);
                if (c) {
                    document.getElementById('adm-name').value = c.name;
                    document.getElementById('adm-id').value = c.id;
                    document.getElementById('adm-price').value = c.price;
                    activeMonths = Array.isArray(c.paid) ? [...c.paid] : [];
                    this.drawGrid();
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            },

            async delete(id) {
                if (confirm("هل أنت متأكد من حذف هذا الزبون؟")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id));
                }
            },

            clearForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                activeMonths = [];
                this.drawGrid();
            },

            renderUserView(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price;
                
                const curMonthIdx = new Date().getMonth();
                const pastMonths = months.slice(0, curMonthIdx + 1);
                const paidData = u.paid || [];
                
                const unpaidCount = pastMonths.filter(m => !paidData.includes(m)).length;
                document.getElementById('u-due').innerText = unpaidCount * u.price;

                const list = document.getElementById('history-list');
                list.innerHTML = '';
                [...pastMonths].reverse().forEach(m => {
                    const isPaid = paidData.includes(m);
                    const row = document.createElement('div');
                    row.className = 'hist-row';
                    row.innerHTML = `
                        <span>شهر ${m}</span>
                        <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">${isPaid ? 'تم الدفع' : 'متأخر'}</span>
                    `;
                    list.appendChild(row);
                });
            }
        };

        app.init();
        window.app = app;
    </script>
</body>
</html>

```
