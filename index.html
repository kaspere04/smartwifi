<body>

    <header>
        <div class="logo-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI AZILAL</h1>
    </header>

    <div class="container">
        <!-- View: Login -->
        <div id="view-login" class="card">
            <h3 style="margin-top:0; text-align:center">تسجيل الدخول</h3>
            <input type="text" id="login-id" placeholder="أدخل المعرف الخاص بك">
            <button class="btn-main" onclick="app.login()">دخول</button>
        </div>

        <!-- View: User Info -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <div style="font-size:12px; opacity:0.8">مرحباً بك:</div>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <div style="font-size:12px; color:var(--gold)" id="u-year-info">سنة 2025</div>
            </div>
            
            <div class="grid">
                <div class="grid-item"><small>ثمن الاشتراك</small><b id="u-price">0</b><small>درهم/شهر</small></div>
                <div class="grid-item" style="border-bottom: 4px solid var(--red)"><small>المبلغ المتبقي</small><b id="u-due" style="color:var(--red)">0</b><small>درهم</small></div>
            </div>

            <div id="history-list"></div>
            
            <button class="btn-main" style="margin-top:20px; background:#f0f0f0; color:#333" onclick="location.reload()">تسجيل الخروج</button>
        </div>

        <!-- View: Admin Control -->
        <div id="view-admin" class="hidden">
            <div class="card" style="text-align:right">
                <h3 style="margin-top:0">لوحة التحكم</h3>
                <input type="text" id="adm-name" placeholder="اسم الزبون الكامل">
                <input type="text" id="adm-id" placeholder="ID (رقم الهاتف مثلاً)">
                <input type="number" id="adm-price" placeholder="الثمن الشهري">
                
                <p style="font-size:14px; margin-bottom:5px; font-weight:bold">الأشهر المؤداة (2025):</p>
                <div class="m-grid" id="month-grid"></div>
                
                <button class="btn-main" onclick="app.saveClient()">حفظ البيانات</button>
                <button class="btn-main" style="margin-top:10px; background:#eee; color:#333; font-size:14px" onclick="app.clearForm()">+ إضافة زبون جديد</button>
            </div>
            
            <div id="admin-clients-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_ID = "0602359188";
        const COLLECTION_NAME = "wifi_azilal_v3";

        let db, clients = [], activePaidMonths = [];

        const app = {
            async init() {
                const firebaseConfig = JSON.parse(__firebase_config);
                const fbApp = initializeApp(firebaseConfig);
                db = getFirestore(fbApp);
                const auth = getAuth(fbApp);
                await signInAnonymously(auth);

                onSnapshot(collection(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME), (snap) => {
                    clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    this.renderAdminList();
                });

                this.drawMonthGrid();
            },

            drawMonthGrid() {
                const grid = document.getElementById('month-grid');
                grid.innerHTML = '';
                months.forEach(m => {
                    const btn = document.createElement('div');
                    btn.className = 'm-btn';
                    btn.innerText = m;
                    btn.onclick = () => {
                        btn.classList.toggle('active');
                        if(btn.classList.contains('active')) activePaidMonths.push(m);
                        else activePaidMonths = activePaidMonths.filter(x => x !== m);
                    };
                    grid.appendChild(btn);
                });
            },

            login() {
                const id = document.getElementById('login-id').value.trim();
                if(id === ADMIN_ID) {
                    this.switchView('view-admin');
                    return;
                }
                const user = clients.find(c => c.id === id);
                if(user) {
                    this.switchView('view-user');
                    this.renderUser(user);
                } else if(id) {
                    alert("المعرف غير صحيح");
                }
            },

            switchView(id) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-user').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById(id).classList.remove('hidden');
            },

            async saveClient() {
                const name = document.getElementById('adm-name').value;
                const id = document.getElementById('adm-id').value;
                const price = document.getElementById('adm-price').value;

                if(!name || !id || !price) return alert("املأ كل الحقول");

                await setDoc(doc(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME, id), {
                    name, price: Number(price), paid: activePaidMonths
                });
                alert("تم الحفظ");
                this.clearForm();
            },

            clearForm() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                activePaidMonths = [];
                document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            },

            renderAdminList() {
                const list = document.getElementById('admin-clients-list');
                list.innerHTML = '<p style="font-size:12px; color:#888; margin-top:20px">قائمة الزبناء الحالية:</p>';
                clients.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'client-item';
                    div.innerHTML = `
                        <div><b>${c.name}</b><br><small>${c.id}</small></div>
                        <div>
                            <button class="edit-btn" onclick="app.edit('${c.id}')">تعديل</button>
                            <button class="del-btn" onclick="app.remove('${c.id}')">حذف</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            edit(id) {
                const c = clients.find(x => x.id === id);
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                activePaidMonths = [...c.paid];
                document.querySelectorAll('.m-btn').forEach(btn => {
                    btn.classList.toggle('active', activePaidMonths.includes(btn.innerText));
                });
                window.scrollTo(0,0);
            },

            async remove(id) {
                if(confirm("حذف؟")) await deleteDoc(doc(db, 'artifacts', 'wifi-app', 'public', 'data', COLLECTION_NAME, id));
            },

            renderUser(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price;
                
                const currentMonthIdx = new Date().getMonth();
                const pastMonths = months.slice(0, currentMonthIdx + 1);
                const unpaid = pastMonths.filter(m => !u.paid.includes(m)).length;
                document.getElementById('u-due').innerText = unpaid * u.price;

                const list = document.getElementById('history-list');
                list.innerHTML = '';
                pastMonths.forEach(m => {
                    const isPaid = u.paid.includes(m);
                    const row = document.createElement('div');
                    row.className = 'hist-row';
                    row.innerHTML = `
                        <span>شهر ${m}</span>
                        <span class="badge ${isPaid ? 'badge-paid' : 'badge-unpaid'}">
                            ${isPaid ? 'مؤدى ✓' : 'غير مؤدى'}
                        </span>
                    `;
                    list.appendChild(row);
                });
            }
        };

        app.init();
        window.app = app;
    </script>
</body>
</html>
