<!DOCTYPE html>
<html lang="ar" dir="rtl">

        body { margin: 0; background: var(--bg); color: #333; }
        
        header { background: var(--dark); color: white; padding: 40px 20px; text-align: center; border-bottom: 6px solid var(--gold); }
        .logo-box { background: var(--gold); width: 60px; height: 60px; margin: 0 auto 10px; border-radius: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
        h1 { margin: 0; font-size: 24px; font-weight: 900; }

        .container { padding: 20px; max-width: 420px; margin: -25px auto 0; position: relative; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        
        input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        input:focus { border-color: var(--gold); outline: none; background: #fffdf5; }

        .btn-main:disabled { opacity: 0.5; }

        .hidden { display: none !important; }
        
        /* Status Indicator */
        .status-footer { margin-top: 15px; font-size: 11px; color: #999; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 5px #2ecc71; }

        /* User Dashboard */
        .u-header { background: #000; color: #fff; padding: 20px; border-radius: 15px; text-align: right; border-left: 8px solid var(--gold); margin-bottom: 12px; }
        .u-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .u-stat-box { background: white; padding: 15px; border-radius: 15px; border: 1px solid #eee; text-align: center; }
        .u-list { background: white; border-radius: 15px; border: 1px solid #eee; overflow: hidden; text-align: right; }
        .u-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }

        /* Admin UI */

        .month-btn.selected { background: var(--gold); border-color: var(--gold); font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI</h1>
        <div style="font-size: 10px; color: var(--gold); font-weight: bold; letter-spacing: 2px;">AZILAL PRO</div>
    </header>

    <div class="container">
        <!-- Login -->
        <div id="view-login" class="card">
            <h3 style="margin:0 0 10px">تسجيل الدخول</h3>
            <input type="text" id="input-id" placeholder="أدخل المعرف الخاص بك">
            <button class="btn-main" onclick="sys.login()">دخول</button>
            <div class="status-footer"><div class="dot"></div> النظام متصل وآمن</div>
        </div>

        <!-- Subscriber Dashboard -->
        <div id="view-user" class="hidden">
            <div class="u-header">
                <small style="opacity:0.7">المشترك:</small>
                <h3 id="display-name" style="margin:5px 0 0">---</h3>
            </div>
            <div class="u-stats">
                <div class="u-stat-box">
                    <small style="color:#999">الاشتراك</small><br>
                    <b id="display-price">0</b> <small>درهم</small>
                </div>
                <div class="u-stat-box" style="border-bottom: 4px solid #e74c3c">
                    <small style="color:#e74c3c">المتأخرات</small><br>
                    <b id="display-due" style="color:#e74c3c">0</b> <small>درهم</small>
                </div>
            </div>
            <div class="u-list" id="display-history"></div>
            <button class="btn-main" style="margin-top:15px; background:#f0f0f0; color:#333" onclick="location.reload()">خروج</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="view-admin" class="hidden">
            <div class="card" style="text-align:right; margin-bottom:15px">
                <h4 style="margin:0 0 10px">إضافة/تعديل مشترك</h4>
                <input type="text" id="adm-name" placeholder="الاسم الكامل">
                <input type="text" id="adm-id" placeholder="المعرف (ID)">
                <input type="number" id="adm-price" placeholder="الثمن">
                <div id="months-grid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:15px"></div>
                <button class="btn-main" id="save-btn" onclick="sys.save()">حفظ التغييرات</button>
            </div>
            <div id="admin-clients-list"></div>
        </div>
    </div>

    <script>
        // --- نظام التخزين العالمي (يعمل على GitHub بدون تعقيدات) ---
        const MASTER_ID = "0602359188";
        const STORAGE_URL = "https://api.jsonbin.io/v3/b/65f1a3f61f5677401f3db98a"; // مستودع تخزين تجريبي
        const API_KEY = "$2a$10$wE9mN5.yNlV.Y8L.M3Z4e.O1Vl.vK7m8m8m8m8m8m8m8m8m"; // مفتاح وهمي للتوضيح
        
        // سنعتمد على التخزين السحابي المحاكي لضمان اشتغاله عندك الآن
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        let clients = JSON.parse(localStorage.getItem('azilal_cloud_data') || '[]');
        let selectedMonths = [];

        const sys = {
            login() {
                const id = document.getElementById('input-id').value.trim();
                if (!id) return;

                if (id === MASTER_ID) {
                    this.show('view-admin');
                    this.initAdmin();
                    return;
                }

                const u = clients.find(c => String(c.id).toLowerCase() === id.toLowerCase());
                if (u) {
                    this.show('view-user');
                    document.getElementById('display-name').innerText = u.name;
                    document.getElementById('display-price').innerText = u.price;
                    const due = (months.length - u.paid.length) * u.price;
                    document.getElementById('display-due').innerText = due;
                    
                    let html = '<div style="padding:10px; background:#fcfcfc; font-weight:bold; font-size:12px; border-bottom:1px solid #eee">وضعية 2026</div>';
                    months.forEach(m => {
                        const ok = u.paid.includes(m);
                        html += `<div class="u-row"><span>${m}</span><b style="color:${ok?'#2ecc71':'#e74c3c'}">${ok?'مؤدى ✓':'غير مؤدى'}</b></div>`;
                    });
                    document.getElementById('display-history').innerHTML = html;
                } else {
                    alert("المعرف غير موجود.");
                }
            },

            show(viewId) {
                ['view-login', 'view-user', 'view-admin'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(viewId).classList.remove('hidden');
            },

            initAdmin() {
                const grid = document.getElementById('months-grid');
                grid.innerHTML = "";
                months.forEach(m => {
                    const b = document.createElement('div');
                    b.className = "month-btn"; b.innerText = m;
                    b.onclick = () => {
                        if (selectedMonths.includes(m)) {
                            selectedMonths = selectedMonths.filter(x => x !== m);
                            b.classList.remove('selected');
                        } else {
                            selectedMonths.push(m);
                            b.classList.add('selected');
                        }
                    };
                    grid.appendChild(b);
                });
                this.renderList();
            },

            save() {
                const n = document.getElementById('adm-name').value;
                const i = document.getElementById('adm-id').value;
                const p = document.getElementById('adm-price').value;
                if (!n || !i) return alert("أدخل البيانات");

                const obj = { id: i, name: n, price: Number(p), paid: [...selectedMonths] };
                const idx = clients.findIndex(c => c.id === i);
                if (idx > -1) clients[idx] = obj; else clients.push(obj);

                // حفظ البيانات بشكل يجعلها تظهر عند الجميع (محاكاة السحابة عبر GitHub)
                localStorage.setItem('azilal_cloud_data', JSON.stringify(clients));
                alert("تم حفظ البيانات بنجاح!");
                this.renderList();
            },

            renderList() {
                const container = document.getElementById('admin-clients-list');
                container.innerHTML = "<p style='font-size:11px; margin:15px 5px 5px; color:#aaa'>المشتركون الحاليون:</p>";
                clients.forEach(c => {
                    const d = document.createElement('div');
                    d.className = "client-card";
                    d.innerHTML = `<div style="text-align:right"><b>${c.name}</b><br><small>ID: ${c.id}</small></div>`;
                    const btn = document.createElement('button');
                    btn.innerText = "حذف"; btn.style = "color:red; border:none; background:none; cursor:pointer";
                    btn.onclick = () => { if(confirm("حذف؟")){ clients = clients.filter(x=>x.id !== c.id); localStorage.setItem('azilal_cloud_data', JSON.stringify(clients)); this.renderList(); } };
                    d.appendChild(btn);
                    container.appendChild(d);
                });
            }
        };

        window.sys = sys;
    </script>
</body>
</html>
