</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- خلفية تجميلية -->
    <div class="fixed inset-0 -z-10 opacity-5 pointer-events-none">
        <svg width="100%" height="100%"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="black" stroke-width="1"/></pattern><rect width="100%" height="100%" fill="url(#grid)" /></svg>
    </div>

    <!-- Header المطور بناءً على شعارك -->
    <header class="w-full bg-black pt-12 pb-16 px-6 text-center border-b-[10px] border-[#FFCC00] shadow-2xl relative">
        <div class="inline-block p-4 bg-[#FFCC00] rounded-3xl mb-4 shadow-lg transform -rotate-2">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1 class="text-4xl font-black italic text-white tracking-tighter leading-none uppercase">SMART WIFI</h1>
        <div class="inline-block bg-[#FFCC00] text-black px-6 py-1 text-4xl font-black italic mt-2 rounded-xl">AZILAL</div>
        <p class="text-white/40 text-[10px] mt-6 tracking-[0.5em] font-bold uppercase italic">توصلك فين ما كنت</p>

    <!-- منطقة المحتوى -->
    <main class="w-full max-w-md px-6 -mt-10 relative z-30">
        
        <!-- واجهة الدخول -->
        <section id="login-card" class="bg-white rounded-[2.5rem] p-8 shadow-premium border border-white/50">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-slate-800">بوابة المشتركين</h2>
                <p class="text-slate-400 text-xs font-bold mt-1 uppercase italic">يرجى إدخال رقم المعرف الخاص بك</p>
            </div>

            <div class="space-y-4">
                <input type="text" id="id-input" placeholder="06XXXXXXXX" 
                       class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-center font-black text-2xl focus:border-[#FFCC00] transition-all outline-none">
                
                <button onclick="checkUser()" id="login-btn" class="w-full bg-black text-[#FFCC00] py-5 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                    <span>دخول إلى الحساب</span>

            </div>

            </div>
        </section>

        <!-- واجهة لوحة الإدارة (تظهر للمدير فقط) -->
        <section id="admin-panel" class="hidden space-y-6">
            <div class="bg-[#FFCC00] p-8 rounded-[2.5rem] shadow-xl">
                <h3 class="text-3xl font-black italic">CONTROL</h3>
                <p class="text-black/40 text-[10px] font-bold uppercase tracking-widest">إدارة المشتركين السحابية</p>
            </div>
            
            <div class="bg-white p-6 rounded-[2rem] shadow-xl space-y-4 border border-white">
                <input type="text" id="adm-name" placeholder="الاسم الكامل" class="w-full p-4 bg-slate-50 rounded-xl border font-bold">
                <input type="text" id="adm-id" placeholder="المعرف (رقم الهاتف)" class="w-full p-4 bg-slate-50 rounded-xl border font-bold">
                <div id="month-grid" class="grid grid-cols-3 gap-2 py-2"></div>

            </div>

            <div id="clients-list" class="space-y-2"></div>
        </section>

        <!-- واجهة المشترك (تظهر للزبون) -->
        <section id="user-panel" class="hidden space-y-4">
            <div class="bg-black text-white p-8 rounded-[2.5rem] shadow-2xl border-r-[12px] border-[#FFCC00] relative">
                <p class="text-[#FFCC00] text-[10px] font-bold uppercase mb-1 italic">مرحباً بك</p>
                <h3 id="u-name" class="text-3xl font-black italic">---</h3>
                <button onclick="location.reload()" class="absolute top-6 left-6 text-white/20 hover:text-white"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-3xl border border-white shadow-sm text-center">
                    <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">الاشتراك</p>
                    <span id="u-price" class="text-2xl font-black italic">0 د</span>
                </div>
                <div class="bg-red-600 text-white p-6 rounded-3xl shadow-lg shadow-red-100 text-center">
                    <p class="text-white/60 text-[10px] font-bold uppercase mb-1">الباقي</p>
                    <span id="u-due" class="text-2xl font-black italic">0 د</span>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-white">
                <div class="p-5 bg-slate-50 border-b flex justify-between items-center">
                    <span class="font-black text-slate-700 text-sm">سجل الدفعات 2026</span>
                </div>
                <div id="u-history" class="divide-y divide-slate-50"></div>
            </div>
        </section>

    </main>

    <footer class="p-10 text-center text-slate-400 opacity-50">
        <p class="text-[9px] font-black italic tracking-[0.5em] uppercase">Smart WIFI Azilal © 2026</p>
    </footer>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js)";
        import { getAuth, signInAnonymously } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js)";

        // إعدادات السحابة
        const fCfg = JSON.parse(__firebase_config);
        const app = initializeApp(fCfg);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const aId = typeof __app_id !== 'undefined' ? __app_id : 'smart-wifi-final-v3';

        const mos = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        let clients = [];
        let pMonths = [];

        // تشغيل الاتصال
        async function init() {
            try {
                await signInAnonymously(auth);
                document.getElementById('conn-status').classList.remove('grayscale', 'opacity-50');
                document.getElementById('status-led').className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                document.getElementById('status-label').className = "text-[9px] font-black uppercase text-green-600 italic";
                document.getElementById('status-label').innerText = "متصل بالسحابة ✓";

                // استماع فوري للبيانات
                const col = collection(db, 'artifacts', aId, 'public', 'data', 'clients');
                onSnapshot(col, (s) => {
                    clients = s.docs.map(d => ({id: d.id, ...d.data()}));
                    renderAdminList();
                });
            } catch (e) {
                console.log("Cloud delay");
                document.getElementById('status-label').innerText = "وضع المعاينة (أوفلاين)";
            }
        }

        // تسجيل الدخول
        window.checkUser = () => {
            const val = document.getElementById('id-input').value.trim();
            if (!val) return;

            // كود الإدارة (من صورتك)
            if (val === "0602359188") {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                initAdminGrid();
                return;
            }

            const c = clients.find(x => x.id === val);
            if (c) {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('user-panel').classList.remove('hidden');
                document.getElementById('u-name').innerText = c.name;
                document.getElementById('u-price').innerText = c.price + " د";
                const due = (mos.length - c.paid.length) * c.price;
                document.getElementById('u-due').innerText = due + " د";

                const hist = document.getElementById('u-history');
                hist.innerHTML = "";
                mos.forEach(m => {
                    const ok = c.paid.includes(m);
                    hist.innerHTML += `
                        <div class="flex justify-between items-center p-5 text-sm font-black italic">
                            <span class="text-slate-500">${m}</span>
                            <span class="${ok ? 'text-green-600' : 'text-red-400'}">${ok ? 'تم الأداء ✓' : 'في الانتظار'}</span>
                        </div>`;
                });
            } else {
                alert("المعرف غير مسجل. يرجى التواصل مع الإدارة.");
            }
        };

        // لوحة الإدارة
        function initAdminGrid() {
            const g = document.getElementById('month-grid');
            g.innerHTML = "";
            mos.forEach(m => {
                const b = document.createElement('button');
                b.innerText = m;
                b.className = "p-2 text-[10px] font-black border-2 rounded-xl border-slate-100 text-slate-300 transition-all bg-white";
                b.onclick = () => {
                    if (pMonths.includes(m)) {
                        pMonths = pMonths.filter(x => x !== m);
                        b.className = "p-2 text-[10px] font-black border-2 rounded-xl border-slate-100 text-slate-300 bg-white";
                    } else {
                        pMonths.push(m);
                        b.className = "p-2 text-[10px] font-black border-2 rounded-xl border-[#FFCC00] text-black bg-[#FFCC00] shadow-lg";
                    }
                };
                g.appendChild(b);
            });
        }

        window.saveUser = async () => {
            const n = document.getElementById('adm-name').value;
            const i = document.getElementById('adm-id').value;
            if(!n || !i) return alert("املأ البيانات!");
            
            const btn = document.getElementById('save-btn');
            btn.innerText = "جاري المزامنة...";
            btn.disabled = true;

            try {
                await setDoc(doc(db, 'artifacts', aId, 'public', 'data', 'clients', i), {
                    name: n, price: 200, paid: [...pMonths]
                });
                alert("تم الحفظ في السحابة!");
                location.reload();
            } catch (e) { alert("خطأ!"); btn.disabled = false; btn.innerText = "تأكيد وحفظ"; }
        };

        function renderAdminList() {
            const list = document.getElementById('clients-list');
            list.innerHTML = "<p class='text-[10px] font-black text-slate-400 px-4 mt-6 uppercase'>لائحة الزبناء</p>";
            clients.forEach(c => {
                const d = document.createElement('div');
                d.className = "bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100";
                d.innerHTML = `
                    <div><p class="font-black text-sm italic">${c.name}</p><p class="text-[9px] text-slate-300">ID: ${c.id}</p></div>
                    <button class="bg-red-50 text-red-500 text-[10px] font-black px-4 py-2 rounded-xl">حذف</button>
                `;
                d.querySelector('button').onclick = async () => {
                    if (confirm("حذف الزبون؟")) await deleteDoc(doc(db, 'artifacts', aId, 'public', 'data', 'clients', c.id));
                };
                list.appendChild(d);
            });
        }

        init();
    </script>
</body>
</html>
