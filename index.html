<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL</title>
    <!-- تم وضع التصميم داخلياً لضمان العمل بدون إنترنت قوي -->
    <style>
        :root { --main-gold: #FFD700; --dark-bg: #111111; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
        
        /* Header Style */
        header { 
            background: var(--dark-bg); 
            color: white; 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 8px solid var(--main-gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .logo-box {
            background: var(--main-gold);
            width: 70px; height: 70px;
            margin: 0 auto 15px;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            transform: rotate(-3deg);
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: -1px; font-style: italic; }
        .city-tag { 
            background: var(--main-gold); 
            color: black; 
            display: inline-block; 
            padding: 2px 15px; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 5px;
        }

        /* Card Container */
        .container { padding: 20px; max-width: 400px; margin: -30px auto 0; position: relative; z-index: 10; }
        .card { 
            background: white; 
            border-radius: 30px; 
            padding: 30px; 
            shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* Inputs & Buttons */
        input {
            width: 100%;
            padding: 18px;
            border: 2px solid #eee;
            border-radius: 15px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--main-gold); outline: none; background: #fffdf0; }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: var(--dark-bg);
            color: var(--main-gold);
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: scale(0.98); }

        /* Dashboard Styles */
        .hidden { display: none; }
        .user-info { background: #000; color: #fff; padding: 25px; border-radius: 20px; text-align: right; border-left: 10px solid var(--main-gold); margin-bottom: 15px; }
        .stats { display: grid; grid-template-columns: 1s 1s; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: white; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #eee; }
        .history { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; }
        .history-item { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f9f9f9; font-size: 14px; }

        /* Status Dot */
        .status-bar { margin-top: 20px; font-size: 10px; color: #aaa; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #ccc; border-radius: 50%; }
        .dot.online { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

        /* Admin Controls */
        .admin-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI</h1>
        <div class="city-tag">AZILAL</div>
    </header>

    <div class="container">
        <!-- شاشة الدخول -->
        <div id="view-login" class="card">
            <h2 style="margin-top:0">بوابة المشتركين</h2>
            <p style="color:#888; font-size:12px; margin-bottom:25px">يرجى إدخال رقم المعرف الخاص بك</p>
            
            <input type="text" id="input-id" placeholder="06XXXXXXXX">
            
            <button class="btn" onclick="app.handleLogin()">
                دخول إلى الحساب
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 3l6 6-6 6M21 9H9"/></svg>
            </button>

            <div class="status-bar">
                <div id="sync-dot" class="dot"></div>
                <span id="sync-text">جاري مزامنة السحابة...</span>
            </div>
        </div>

        <!-- شاشة المستخدم -->
        <div id="view-user" class="hidden">
            <div class="user-info">
                <div style="color: var(--main-gold); font-size: 10px; font-weight: bold; margin-bottom: 5px;">مرحباً بك</div>
                <h2 id="disp-name" style="margin:0; font-style: italic;">---</h2>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="stat-box" style="flex:1">
                    <div style="font-size:10px; color:#aaa; margin-bottom:5px">الاشتراك</div>
                    <div id="disp-price" style="font-size:20px; font-weight:900">0 د</div>
                </div>
                <div class="stat-box" style="flex:1; background: #e74c3c; color: white; border: none;">
                    <div style="font-size:10px; opacity:0.7; margin-bottom:5px">الباقي</div>
                    <div id="disp-due" style="font-size:20px; font-weight:900">0 د</div>
                </div>
            </div>

            <div class="history">
                <div style="padding: 15px; background: #fcfcfc; border-bottom: 1px solid #eee; font-weight: bold; font-size: 13px;">تتبع الأداء 2026</div>
                <div id="list-months"></div>
            </div>
            
            <button class="btn" style="margin-top:20px; background:#eee; color:#333;" onclick="location.reload()">تسجيل الخروج</button>
        </div>

        <!-- شاشة الإدارة -->
        <div id="view-admin" class="hidden">
            <div style="background: var(--main-gold); padding: 25px; border-radius: 20px; margin-bottom: 15px;">
                <h2 style="margin:0">لوحة الإدارة</h2>
                <p style="margin:0; font-size: 11px; opacity: 0.6;">إضافة وتعديل المشتركين</p>
            </div>
            
            <div class="card" style="margin-bottom: 15px; text-align: right;">
                <label style="font-size:12px; font-weight:bold;">الاسم الكامل</label>
                <input type="text" id="adm-name" style="font-size:16px; padding:12px; margin-top:5px">
                
                <label style="font-size:12px; font-weight:bold;">رقم الهاتف (ID)</label>
                <input type="text" id="adm-id" style="font-size:16px; padding:12px; margin-top:5px">
                
                <p style="font-size:11px; color:#888;">الشهور المؤداة:</p>
                <div id="adm-month-selector" style="display:grid; grid-template-columns: repeat(3, 1s); gap:5px; margin-bottom:15px"></div>
                
                <button class="btn" onclick="app.saveClient()" id="btn-save">حفظ البيانات</button>
            </div>

            <div id="admin-clients-list"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js)";
        import { getAuth, signInAnonymously } from "[https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js)";

        const firebaseConfig = JSON.parse(__firebase_config);
        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);
        const auth = getAuth(fbApp);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'azilal-v3-final';

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        let clients = [];
        let selectedMonths = [];

        const app = {
            async init() {
                try {
                    await signInAnonymously(auth);
                    document.getElementById('sync-dot').classList.add('online');
                    document.getElementById('sync-text').innerText = "متصل بالسحابة ✓";
                    this.listen();
                } catch (e) {
                    document.getElementById('sync-text').innerText = "فشل الاتصال - تأكد من الإعدادات";
                }
            },

            listen() {
                const col = collection(db, 'artifacts', appId, 'public', 'data', 'clients');
                onSnapshot(col, (snap) => {
                    clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    this.updateAdminList();
                });
            },

            handleLogin() {
                const val = document.getElementById('input-id').value.trim();
                if (!val) return;

                // دخول الإدارة
                if (val === "0602359188") {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-admin').classList.remove('hidden');
                    this.initMonthSelector();
                    return;
                }

                const c = clients.find(x => x.id === val);
                if (c) {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-user').classList.remove('hidden');
                    document.getElementById('disp-name').innerText = c.name;
                    document.getElementById('disp-price').innerText = c.price + " د";
                    
                    const dueCount = months.length - c.paid.length;
                    document.getElementById('disp-due').innerText = (dueCount * c.price) + " د";

                    const list = document.getElementById('list-months');
                    list.innerHTML = "";
                    months.forEach(m => {
                        const isPaid = c.paid.includes(m);
                        list.innerHTML += `
                            <div class="history-item">
                                <span style="color:#666">${m}</span>
                                <span style="font-weight:bold; color:${isPaid ? '#2ecc71' : '#e74c3c'}">
                                    ${isPaid ? 'مؤدى ✓' : 'غير مؤدى'}
                                </span>
                            </div>`;
                    });
                } else {
                    alert("المعرف غير موجود. المرجو التأكد من الرقم.");
                }
            },

            initMonthSelector() {
                const container = document.getElementById('adm-month-selector');
                container.innerHTML = "";
                months.forEach(m => {
                    const b = document.createElement('div');
                    b.innerText = m;
                    b.style = "padding:8px; font-size:10px; border:1px solid #eee; border-radius:8px; cursor:pointer; text-align:center; font-weight:bold; color:#ccc;";
                    b.onclick = () => {
                        if (selectedMonths.includes(m)) {
                            selectedMonths = selectedMonths.filter(x => x !== m);
                            b.style.background = "white"; b.style.color = "#ccc"; b.style.borderColor = "#eee";
                        } else {
                            selectedMonths.push(m);
                            b.style.background = "#FFD700"; b.style.color = "black"; b.style.borderColor = "#FFD700";
                        }
                    };
                    container.appendChild(b);
                });
            },

            async saveClient() {
                const name = document.getElementById('adm-name').value;
                const id = document.getElementById('adm-id').value;
                if (!name || !id) return alert("املأ الاسم والمعرف");

                const btn = document.getElementById('btn-save');
                btn.disabled = true; btn.innerText = "جاري الحفظ...";

                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id), {
                        name, price: 200, paid: selectedMonths
                    });
                    alert("تم حفظ المشترك بنجاح");
                    location.reload();
                } catch (e) {
                    alert("خطأ في الحفظ");
                    btn.disabled = false; btn.innerText = "حفظ البيانات";
                }
            },

            updateAdminList() {
                const list = document.getElementById('admin-clients-list');
                list.innerHTML = "<p style='font-size:11px; color:#888; margin: 20px 10px 10px;'>قائمة المشتركين الحالية:</p>";
                clients.forEach(c => {
                    const div = document.createElement('div');
                    div.className = "admin-item";
                    div.innerHTML = `
                        <div style="text-align:right">
                            <div style="font-weight:bold; font-size:14px">${c.name}</div>
                            <div style="font-size:10px; color:#aaa">${c.id}</div>
                        </div>
                        <button onclick="app.deleteClient('${c.id}')" style="background:#fff1f1; border:none; color:#e74c3c; padding:8px 12px; border-radius:10px; font-weight:bold; font-size:12px">حذف</button>
                    `;
                    list.appendChild(div);
                });
            },

            async deleteClient(id) {
                if (confirm("هل أنت متأكد من حذف هذا المشترك؟")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', id));
                }
            }
        };

        window.app = app;
        app.init();
    </script>
</body>
</html>

```
