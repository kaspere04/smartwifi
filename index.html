```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL - النسخة الاحترافية</title>
    <style>
        :root { --gold: #FFCC00; --dark: #111; --bg: #f4f7f6; --red: #e74c3c; --green: #2ecc71; --gray: #888; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        header { background: var(--dark); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .logo-box { background: var(--gold); width: 45px; height: 45px; margin: 0 auto 10px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }

        .container { padding: 15px; max-width: 450px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #eee; margin-top: -20px; position: relative; z-index: 10; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; background: #fff; }
        input:focus { border-color: var(--gold); outline: none; }
        
        .btn-main { width: 100%; padding: 15px; background: var(--dark); color: var(--gold); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { background: #ccc; color: #666; cursor: not-allowed; }

        .hidden { display: none !important; }
        
        .u-card { background: var(--dark); color: white; padding: 20px; border-radius: 15px; text-align: right; border-right: 6px solid var(--gold); margin-bottom: 15px; margin-top: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-item { background: white; padding: 12px; border-radius: 12px; border: 1px solid #eee; text-align: center; }
        .grid-item b { font-size: 20px; display: block; color: var(--dark); }

        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 15px 0; }
        .m-btn { padding: 12px 5px; border: 1px solid #eee; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fdfdfd; color: #999; text-align: center; }
        .m-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .client-list-box { background: white; border-radius: 12px; margin-top: 10px; border: 1px solid #eee; overflow: hidden; }
        .client-item { padding: 12px 15px; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; align-items: center; }
        .client-item:last-child { border-bottom: none; }
        
        .edit-btn { color: #3498db; border: 1px solid #3498db; padding: 5px 12px; border-radius: 5px; background: none; font-size: 12px; font-weight: bold; }
        .del-btn { color: #e74c3c; border: none; background: none; margin-right: 10px; font-size: 12px; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--dark); }
    </style>
</head>
<body>

    <div id="loading-overlay" class="hidden">جاري الحفظ...</div>

    <header>
        <div class="logo-box">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI AZILAL</h1>
    </header>

    <div class="container">
        <!-- Login View -->
        <div id="view-login" class="card">
            <h3 style="margin-top:0; text-align:center">تسجيل الدخول</h3>
            <input type="text" id="login-id" placeholder="أدخل ID الخاص بك">
            <button class="btn-main" onclick="app.login()">دخول</button>
        </div>

        <!-- Subscriber View -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <div style="font-size:12px; opacity:0.8">الاسم الكامل:</div>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <div id="u-year-label" style="font-size:12px; color:var(--gold)">---</div>
            </div>
            <div class="grid">
                <div class="grid-item"><small>الاشتراك</small><b id="u-price">0</b><small>درهم</small></div>
                <div class="grid-item" style="border-bottom: 3px solid var(--red)"><small style="color:var(--red)">الباقي</small><b id="u-due" style="color:var(--red)">0</b><small>درهم</small></div>
            </div>
            <div id="u-history" style="margin-top:15px; background:white; border-radius:15px; border:1px solid #eee; overflow:hidden"></div>
            <button class="btn-main" style="margin-top:20px; background:#ddd; color:#333" onclick="location.reload()">خروج</button>
        </div>

        <!-- Admin View -->
        <div id="view-admin" class="hidden">
            <div class="card" style="text-align:right">
                <h3 style="margin-top:0">لوحة التحكم</h3>
                <input type="text" id="adm-name" placeholder="الاسم الكامل للزبون">
                <input type="text" id="adm-id" placeholder="ID (رقم الهاتف مثلاً)">
                <input type="number" id="adm-price" placeholder="ثمن الاشتراك الشهري">
                
                <div style="margin:10px 0; border:1px solid #eee; padding:10px; border-radius:10px">
                    <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:5px">السنة المستهدفة:</label>
                    <select id="adm-year" onchange="app.drawMonthGrid()"></select>
                </div>

                <label style="font-size:12px; font-weight:bold;">الأشهر المؤداة لهذه السنة:</label>
                <div class="m-grid" id="adm-months-grid"></div>
                
                <button class="btn-main" id="save-btn" onclick="app.saveData()">حفظ البيانات بشكل نهائي</button>
                <button class="btn-main" style="margin-top:10px; background:#f0f0f0; color:#444" onclick="app.clearForm()">إضافة زبون جديد (تفريغ)</button>
            </div>

            <div id="adm-list-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const ADMIN_CODE = "0602359188";
        const COLLECTION_ID = "wifi_final_v8"; 
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        
        const now = new Date();
        const currentYear = now.getFullYear();

        let db, allClients = [], activePaidList = []; 

        const app = {
            async init() {
                // ملء قائمة السنوات
                const yr = document.getElementById('adm-year');
                for(let i=2024; i<=2028; i++){
                    const op = document.createElement('option');
                    op.value = i; op.innerText = i;
                    if(i === currentYear) op.selected = true;
                    yr.appendChild(op);
                }

                try {
                    const config = JSON.parse(__firebase_config);
                    const fbApp = initializeApp(config);
                    db = getFirestore(fbApp);
                    const auth = getAuth(fbApp);
                    await signInAnonymously(auth);

                    onSnapshot(collection(db, 'artifacts', 'wifi-manager', 'public', 'data', COLLECTION_ID), (snap) => {
                        allClients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        this.renderAdminList();
                    });
                } catch (e) { console.error(e); }
            },

            login() {
                const id = document.getElementById('login-id').value.trim();
                if(id === ADMIN_CODE) {
                    this.showView('view-admin');
                    this.clearForm();
                    return;
                }
                const user = allClients.find(c => String(c.id) === id);
                if(user) {
                    this.showView('view-user');
                    this.renderUserView(user);
                } else if(id) {
                    alert("المعرف غير موجود");
                }
            },

            showView(v) {
                ['view-login', 'view-user', 'view-admin'].forEach(x => document.getElementById(x).classList.add('hidden'));
                document.getElementById(v).classList.remove('hidden');
            },

            clearForm() {
                document.getElementById('adm-name').value = "";
                document.getElementById('adm-id').value = "";
                document.getElementById('adm-price').value = "";
                activePaidList = [];
                this.drawMonthGrid();
            },

            drawMonthGrid() {
                const grid = document.getElementById('adm-months-grid');
                const selectedYear = document.getElementById('adm-year').value;
                grid.innerHTML = "";
                
                months.forEach(m => {
                    const key = `${selectedYear}-${m}`;
                    const div = document.createElement('div');
                    div.className = `m-btn ${activePaidList.includes(key) ? 'active' : ''}`;
                    div.innerText = m;
                    div.onclick = () => {
                        if(activePaidList.includes(key)) {
                            activePaidList = activePaidList.filter(k => k !== key);
                            div.classList.remove('active');
                        } else {
                            activePaidList.push(key);
                            div.classList.add('active');
                        }
                    };
                    grid.appendChild(div);
                });
            },

            async saveData() {
                const name = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const price = document.getElementById('adm-price').value;

                if(!name || !id || !price) return alert("المرجو ملء جميع البيانات");

                const loader = document.getElementById('loading-overlay');
                loader.classList.remove('hidden');

                try {
                    // حفظ البيانات مع ضمان بقاء مصفوفة الشهور مستقلة لكل زبون
                    await setDoc(doc(db, 'artifacts', 'wifi-manager', 'public', 'data', COLLECTION_ID, id), {
                        name: name,
                        price: Number(price),
                        paid: [...activePaidList] // نسخة من المصفوفة لضمان عدم التداخل
                    });
                    
                    alert("تم الحفظ بنجاح ✅");
                    this.clearForm(); // تصفير النموذج فوراً بعد الحفظ
                } catch (e) {
                    alert("خطأ في الحفظ، جرب مرة أخرى");
                } finally {
                    loader.classList.add('hidden');
                }
            },

            renderAdminList() {
                const cont = document.getElementById('adm-list-container');
                if(!cont) return;
                cont.innerHTML = "<p style='font-size:12px; margin:15px 5px'>قائمة الزبناء المسجلين:</p>";
                const box = document.createElement('div');
                box.className = "client-list-box";
                
                allClients.forEach(c => {
                    const item = document.createElement('div');
                    item.className = "client-item";
                    item.innerHTML = `<div><b>${c.name}</b><br><small style="color:#888">${c.id}</small></div>`;
                    
                    const actions = document.createElement('div');
                    const eb = document.createElement('button');
                    eb.className = "edit-btn"; eb.innerText = "تعديل";
                    eb.onclick = () => {
                        document.getElementById('adm-name').value = c.name;
                        document.getElementById('adm-id').value = c.id;
                        document.getElementById('adm-price').value = c.price;
                        activePaidList = Array.isArray(c.paid) ? [...c.paid] : [];
                        this.drawMonthGrid();
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };

                    const dbtn = document.createElement('button');
                    dbtn.className = "del-btn"; dbtn.innerText = "حذف";
                    dbtn.onclick = async () => {
                        if(confirm("هل تريد حذف هذا الزبون؟")) {
                            await deleteDoc(doc(db, 'artifacts', 'wifi-manager', 'public', 'data', COLLECTION_ID, c.id));
                        }
                    };

                    actions.append(eb, dbtn);
                    item.appendChild(actions);
                    box.appendChild(item);
                });
                cont.appendChild(box);
            },

            renderUserView(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price;
                document.getElementById('u-year-label').innerText = `كشف مستحقات سنة ${currentYear}`;
                
                const passedMonths = months.slice(0, now.getMonth() + 1);
                const unpaidCount = passedMonths.filter(m => !u.paid.includes(`${currentYear}-${m}`)).length;
                document.getElementById('u-due').innerText = unpaidCount * u.price;

                let html = "";
                passedMonths.forEach(m => {
                    const isPaid = u.paid.includes(`${currentYear}-${m}`);
                    html += `
                    <div style="display:flex; justify-content:space-between; padding:12px 15px; border-bottom:1px solid #f8f8f8; font-size:14px; align-items:center">
                        <span>${m}</span>
                        <span style="padding:4px 10px; border-radius:8px; font-size:11px; font-weight:bold; background:${isPaid?'#e8f5e9':'#ffebee'}; color:${isPaid?'#2ecc71':'#e74c3c'}">
                            ${isPaid ? 'مؤدى ✓' : 'غير مؤدى'}
                        </span>
                    </div>`;
                });
                document.getElementById('u-history').innerHTML = html;
            }
        };

        app.init();
        window.app = app;
    </script>
</body>
</html>
