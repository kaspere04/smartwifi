<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL - Cloud Sync Fixed</title>
    <style>
        :root { --gold: #FFCC00; --dark: #111; --bg: #f2f2f2; --red: #e74c3c; --green: #2ecc71; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; padding-bottom: 50px; }
        
        header { background: var(--dark); color: white; padding: 25px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .logo-box { background: var(--gold); width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        h1 { margin: 0; font-size: 18px; }

        .container { padding: 15px; max-width: 450px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #ddd; }
        
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; background: #fff; }
        input:focus { border-color: var(--gold); outline: none; }
        
        .btn-main { width: 100%; padding: 15px; background: var(--dark); color: var(--gold); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-main:active { opacity: 0.8; transform: scale(0.98); }
        .btn-main:disabled { opacity: 0.5; background: #999; }

        .hidden { display: none !important; }
        
        .u-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; border-right: 6px solid var(--gold); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-item { background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; text-align: center; }
        .grid-item b { font-size: 20px; display: block; color: var(--dark); }

        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 15px 0; }
        .m-btn { padding: 12px 5px; border: 2px solid #eee; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fff; color: #bbb; text-align: center; font-weight: bold; transition: all 0.2s; }
        .m-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .client-item { background: white; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .edit-btn { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .del-btn { color: #dc3545; background: none; border: none; font-size: 12px; margin-right: 10px; padding: 5px; }

        #status-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--gold); padding: 12px 25px; border-radius: 30px; font-size: 14px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 2px solid var(--gold); }
    </style>
</head>
<body>

    <div id="status-msg" class="hidden">جاري مزامنة السحاب...</div>

    <header>
        <div class="logo-box">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI AZILAL</h1>
    </header>

    <div class="container">
        <!-- تسجيل الدخول -->
        <div id="view-login" class="card">
            <h3 style="text-align:center">دخول المشتركين</h3>
            <input type="text" id="login-id" placeholder="ID الخاص بك">
            <button class="btn-main" onclick="app.handleLogin()">تسجيل الدخول</button>
        </div>

        <!-- واجهة المشترك -->
        <div id="view-user" class="hidden">
            <div class="u-card">
                <div style="font-size:11px; opacity:0.7">الزبون:</div>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <div id="u-year-label" style="font-size:12px; color:var(--gold)">---</div>
            </div>
            <div class="grid">
                <div class="grid-item"><small>الاشتراك</small><b id="u-price">0</b></div>
                <div class="grid-item" style="border-bottom: 4px solid var(--red)"><small>المتأخرات</small><b id="u-due" style="color:var(--red)">0</b></div>
            </div>
            <div id="u-history" style="margin-top:15px; background:white; border-radius:12px; border:1px solid #ddd; overflow:hidden"></div>
            <button class="btn-main" style="margin-top:20px; background:#ccc; color:#000" onclick="location.reload()">تسجيل الخروج</button>
        </div>

        <!-- واجهة الإدارة -->
        <div id="view-admin" class="hidden">
            <div class="card" style="text-align:right">
                <h3 style="margin:0 0 15px 0">إدارة الزبناء</h3>
                <input type="text" id="adm-name" placeholder="اسم الزبون">
                <input type="text" id="adm-id" placeholder="ID (رقم الهاتف)">
                <input type="number" id="adm-price" placeholder="الثمن الشهري">
                
                <div style="background:#f8f8f8; padding:10px; border-radius:8px; margin-bottom:10px">
                    <label style="font-size:12px; font-weight:bold;">اختر السنة لتعديلها:</label>
                    <select id="adm-year" onchange="app.drawGrid()"></select>
                </div>

                <div class="m-grid" id="adm-grid"></div>
                
                <button class="btn-main" id="btn-save" onclick="app.performSave()">حفظ وتحديث السحاب</button>
                <button class="btn-main" style="background:#eee; color:#333; font-size:13px" onclick="app.resetUI()">+ زبون جديد (تصفير)</button>
            </div>
            <div id="adm-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const PIN = "0602359188";
        const STORAGE_ID = "v10_nuclear_sync"; // معرف فريد جديد لقطع أي صلة سابقة
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        
        let db, clients = [], activePaid = new Set(); 
        const currentYear = new Date().getFullYear();

        const app = {
            async init() {
                const sel = document.getElementById('adm-year');
                for(let i=2024; i<=2028; i++) {
                    const o = document.createElement('option');
                    o.value = i; o.innerText = i;
                    if(i === currentYear) o.selected = true;
                    sel.appendChild(o);
                }

                try {
                    const config = JSON.parse(__firebase_config);
                    const fApp = initializeApp(config);
                    db = getFirestore(fApp);
                    const auth = getAuth(fApp);
                    await signInAnonymously(auth);

                    onSnapshot(collection(db, 'artifacts', 'smart-wifi', 'public', 'data', STORAGE_ID), (snap) => {
                        clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        this.renderList();
                    });
                } catch (e) { console.error("Firebase Error:", e); }
            },

            handleLogin() {
                const id = document.getElementById('login-id').value.trim();
                if(id === PIN) { this.switchView('view-admin'); this.resetUI(); return; }
                const user = clients.find(c => String(c.id) === id);
                if(user) { this.switchView('view-user'); this.renderUser(user); }
                else if(id) alert("المعرف غير مسجل في النظام");
            },

            switchView(id) {
                ['view-login', 'view-user', 'view-admin'].forEach(v => document.getElementById(v).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            },

            resetUI() {
                document.getElementById('adm-name').value = "";
                document.getElementById('adm-id').value = "";
                document.getElementById('adm-price').value = "";
                activePaid.clear(); // مسح جذري للذاكرة
                this.drawGrid();
            },

            drawGrid() {
                const grid = document.getElementById('adm-grid');
                const yr = document.getElementById('adm-year').value;
                grid.innerHTML = "";
                
                months.forEach(m => {
                    const tag = `${yr}-${m}`;
                    const btn = document.createElement('div');
                    btn.className = `m-btn ${activePaid.has(tag) ? 'active' : ''}`;
                    btn.innerText = m;
                    btn.onclick = () => {
                        if(activePaid.has(tag)) {
                            activePaid.delete(tag);
                            btn.classList.remove('active');
                        } else {
                            activePaid.add(tag);
                            btn.classList.add('active');
                        }
                    };
                    grid.appendChild(btn);
                });
            },

            async performSave() {
                const n = document.getElementById('adm-name').value.trim();
                const id = document.getElementById('adm-id').value.trim();
                const p = document.getElementById('adm-price').value;

                if(!n || !id || !p) return alert("الرجاء ملء جميع الحقول");

                const msg = document.getElementById('status-msg');
                msg.classList.remove('hidden');
                const btn = document.getElementById('btn-save');
                btn.disabled = true;

                try {
                    // تحويل الـ Set إلى مصفوفة نظيفة تماماً قبل الإرسال
                    const cleanArray = Array.from(activePaid);
                    
                    await setDoc(doc(db, 'artifacts', 'smart-wifi', 'public', 'data', STORAGE_ID, id), {
                        name: n,
                        price: Number(p),
                        paid: cleanArray,
                        lastUpdated: Date.now()
                    });
                    
                    alert("تم تحديث البيانات بنجاح في السحاب ✅");
                    this.resetUI();
                } catch (e) {
                    alert("فشل الاتصال بالسحاب. تأكد من الإنترنت.");
                } finally {
                    msg.classList.add('hidden');
                    btn.disabled = false;
                }
            },

            renderList() {
                const list = document.getElementById('adm-list');
                if(!list) return;
                list.innerHTML = "<p style='font-size:11px; color:#888; margin:15px 5px'>قائمة المشتركين النشطة:</p>";
                
                clients.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
                    const div = document.createElement('div');
                    div.className = "client-item";
                    div.innerHTML = `<div><b>${c.name}</b><br><small style="color:#888">${c.id}</small></div>`;
                    
                    const actions = document.createElement('div');
                    const eb = document.createElement('button');
                    eb.className = "edit-btn"; eb.innerText = "تعديل";
                    eb.onclick = () => {
                        // عند التعديل، نقوم بمسح الذاكرة أولاً ثم تحميل بيانات الزبون المحدد
                        this.resetUI(); 
                        document.getElementById('adm-name').value = c.name;
                        document.getElementById('adm-id').value = c.id;
                        document.getElementById('adm-price').value = c.price;
                        
                        if(Array.isArray(c.paid)) {
                            c.paid.forEach(tag => activePaid.add(tag));
                        }
                        this.drawGrid();
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };

                    const dbn = document.createElement('button');
                    dbn.className = "del-btn"; dbn.innerText = "حذف";
                    dbn.onclick = async () => {
                        if(confirm(`هل أنت متأكد من حذف ${c.name}؟`)) {
                            await deleteDoc(doc(db, 'artifacts', 'smart-wifi', 'public', 'data', STORAGE_ID, c.id));
                        }
                    };

                    actions.append(eb, dbn);
                    div.appendChild(actions);
                    list.appendChild(div);
                });
            },

            renderUser(u) {
                document.getElementById('u-name').innerText = u.name;
                document.getElementById('u-price').innerText = u.price + " درهم";
                document.getElementById('u-year-label').innerText = `تفاصيل الدفع لسنة ${currentYear}`;
                
                const curM = new Date().getMonth();
                const visible = months.slice(0, curM + 1);
                
                const paidData = Array.isArray(u.paid) ? u.paid : [];
                const unpaidCount = visible.filter(m => !paidData.includes(`${currentYear}-${m}`)).length;
                
                document.getElementById('u-due').innerText = (unpaidCount * u.price) + " درهم";

                let h = "";
                visible.forEach(m => {
                    const ok = paidData.includes(`${currentYear}-${m}`);
                    h += `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #eee; font-size:14px; background:${ok?'#f9fffb':'#fff9f9'}">
                        <span>شهر ${m}</span>
                        <b style="color:${ok?var(--green):var(--red)}">${ok?'خالص ✓':'غير خالص'}</b>
                    </div>`;
                });
                document.getElementById('u-history').innerHTML = h;
            }
        };

        app.init();
        window.app = app;
    </script>
</body>
</html>

```
