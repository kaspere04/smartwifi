```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- تحميل Firebase بنسخة التوافق القصوى -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        * { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f8fafc; margin: 0; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        #loader { 
            position: fixed; inset: 0; background: #0f172a; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; 
        }
        .loader-spin { 
            width: 40px; height: 40px; border: 3px solid #1e293b; 
            border-top-color: #fbbf24; border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .year-btn.active { background: #0f172a; color: #fbbf24; border-color: #fbbf24; }
        .month-btn.active { background: #fbbf24; color: #0f172a; font-weight: bold; border-color: #0f172a; }
    </style>
</head>
<body>

    <!-- شاشة التحميل (ستختفي تلقائياً بعد 5 ثوانٍ كأقصى حد) -->
    <div id="loader">
        <div class="loader-spin mb-6"></div>
        <h1 class="font-black text-2xl tracking-tighter text-white">SMART WIFI <span class="text-yellow-400">AZILAL</span></h1>
        <p id="loader-status" class="text-slate-500 text-xs mt-4">جاري تحميل النظام...</p>
        <button id="bypass-btn" onclick="hideLoader()" class="mt-8 text-[10px] text-slate-600 underline hidden">تجاوز التحميل</button>
    </div>

    <div id="main-content">
        <header class="bg-slate-900 text-white p-5 text-center border-b-4 border-yellow-400 sticky top-0 z-50">
            <h1 class="text-xl font-black italic tracking-tighter">SMART WIFI <span class="text-yellow-400">AZILAL</span></h1>
        </header>

        <main class="max-w-md mx-auto p-4">
            <!-- تسجيل الدخول -->
            <section id="view-login" class="mt-10 bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                <h2 class="text-center font-black text-2xl mb-8 text-slate-800">بوابة المشتركين</h2>
                <div class="space-y-4">
                    <input type="tel" id="login-input" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-center text-2xl font-black outline-none focus:border-yellow-400 transition-all" placeholder="06XXXXXXXX">
                    <button onclick="appLogic.login()" class="w-full bg-slate-900 text-yellow-400 font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">دخول</button>
                </div>
            </section>

            <!-- واجهة الإدارة -->
            <section id="view-admin" class="hidden space-y-6 mt-4">
                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100">
                    <h3 class="font-black text-slate-800 mb-4">إضافة / تعديل مشترك</h3>
                    <div class="space-y-3">
                        <input type="text" id="adm-name" class="w-full p-4 bg-slate-50 border rounded-xl" placeholder="الاسم الكامل">
                        <input type="tel" id="adm-id" class="w-full p-4 bg-slate-50 border rounded-xl" placeholder="رقم الهاتف">
                        <input type="number" id="adm-price" class="w-full p-4 bg-slate-50 border rounded-xl" placeholder="السعر الشهري">
                        
                        <div class="p-3 bg-slate-50 rounded-xl">
                            <p class="text-[10px] font-bold text-slate-400 mb-3 text-center">تحديد الدفعات</p>
                            <div id="year-grid" class="grid grid-cols-4 gap-2 mb-3"></div>
                            <div id="month-grid" class="grid grid-cols-3 gap-2 hidden"></div>
                        </div>

                        <button onclick="appLogic.save()" class="w-full bg-slate-900 text-yellow-400 font-black p-4 rounded-xl mt-4 shadow-lg">حفظ البيانات</button>
                    </div>
                </div>
                <div id="admin-list" class="space-y-3"></div>
                <button onclick="location.reload()" class="w-full py-8 text-slate-300 text-[10px] font-bold uppercase tracking-widest">تسجيل الخروج</button>
            </section>

            <!-- واجهة العميل -->
            <section id="view-client" class="hidden space-y-4">
                <div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl text-center border-b-8 border-yellow-400">
                    <h2 id="c-name" class="text-2xl font-black mb-2">--</h2>
                    <div class="bg-white/5 p-6 rounded-3xl mt-4">
                        <p class="text-[10px] opacity-60 mb-1 uppercase">المبلغ المطلوب أداؤه</p>
                        <div class="text-5xl font-black text-yellow-400"><span id="c-due">0</span><small class="text-sm ml-1">DH</small></div>
                    </div>
                </div>
                <h3 class="font-black text-slate-800 px-2 mt-8">سجل الدفعات</h3>
                <div id="client-history" class="space-y-4 pb-10"></div>
                <button onclick="location.reload()" class="w-full p-4 bg-white text-slate-400 font-bold rounded-2xl border-2 border-slate-100">إغلاق</button>
            </section>
        </main>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black/90 text-yellow-400 px-8 py-4 rounded-2xl text-sm font-bold hidden z-[9999] shadow-2xl"></div>

    <script>
        // إعدادات المتغيرات العامة
        var ADMIN_ID = "0602359188";
        var MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        var YEARS = [2024, 2025, 2026, 2027];
        var db, clients = [], activeYear = null, editingPayments = {};
        var appId = (typeof __app_id !== 'undefined') ? __app_id : 'azilal_wifi_final';

        // وظائف الواجهة
        function hideLoader() {
            var loader = document.getElementById('loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(function(){ loader.classList.add('hidden'); }, 500);
            }
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(function(){ t.classList.add('hidden'); }, 3000);
        }

        // منطق التطبيق
        var appLogic = {
            init: function() {
                // مؤقت طوارئ لإخفاء الشاشة السوداء في حال فشل أي شيء
                setTimeout(function() {
                    document.getElementById('bypass-btn').classList.remove('hidden');
                    if(document.getElementById('loader-status').innerText.indexOf('جاري') > -1) {
                        console.log("Slow connection - showing bypass");
                    }
                }, 5000);

                try {
                    if (typeof __firebase_config === 'undefined') {
                        throw new Error("Config not found");
                    }
                    var config = JSON.parse(__firebase_config);
                    firebase.initializeApp(config);
                    db = firebase.firestore();
                    
                    firebase.auth().signInAnonymously().then(function() {
                        appLogic.sync();
                    }).catch(function(e) {
                        appLogic.status("خطأ في المصادقة: " + e.message);
                    });
                } catch (e) {
                    appLogic.status("انتظار الإعدادات...");
                    // محاولة الإعادة بعد ثانية إذا لم تكن الإعدادات جاهزة
                    setTimeout(appLogic.init, 1000);
                }
            },

            status: function(txt) {
                document.getElementById('loader-status').innerText = txt;
            },

            sync: function() {
                var path = "artifacts/" + appId + "/public/data/clients";
                db.collection(path).onSnapshot(function(snap) {
                    clients = snap.docs.map(function(d){ return d.data(); });
                    appLogic.renderList();
                    hideLoader();
                }, function(err) {
                    appLogic.status("خطأ في البيانات: " + err.message);
                });
            },

            login: function() {
                var val = document.getElementById('login-input').value.trim();
                if(!val) return showToast("أدخل الرقم");
                
                if(val === ADMIN_ID) {
                    appLogic.view('view-admin');
                    appLogic.renderYears();
                } else {
                    var c = clients.find(function(x){ return x.id === val; });
                    if(c) {
                        appLogic.renderClient(c);
                        appLogic.view('view-client');
                    } else {
                        showToast("الرقم غير مسجل");
                    }
                }
            },

            view: function(id) {
                var ids = ['view-login', 'view-admin', 'view-client'];
                for(var i=0; i<ids.length; i++) {
                    document.getElementById(ids[i]).classList.add('hidden');
                }
                document.getElementById(id).classList.remove('hidden');
                window.scrollTo(0,0);
            },

            renderYears: function() {
                var grid = document.getElementById('year-grid');
                grid.innerHTML = YEARS.map(function(y) {
                    var has = editingPayments[y] && editingPayments[y].length > 0;
                    return '<button onclick="appLogic.setYear('+y+')" id="y-'+y+'" class="year-btn p-3 bg-white border-2 rounded-xl text-[10px] font-bold '+(has?'border-yellow-400':'border-slate-100')+'">'+y+'</button>';
                }).join('');
            },

            setYear: function(y) {
                activeYear = y;
                var btns = document.querySelectorAll('.year-btn');
                for(var i=0; i<btns.length; i++) btns[i].classList.remove('active');
                document.getElementById('y-'+y).classList.add('active');
                document.getElementById('month-grid').classList.remove('hidden');
                appLogic.renderMonths();
            },

            renderMonths: function() {
                var grid = document.getElementById('month-grid');
                var paid = editingPayments[activeYear] || [];
                grid.innerHTML = MONTHS.map(function(m) {
                    var isActive = paid.indexOf(m) > -1;
                    return '<button onclick="appLogic.toggleMonth(\''+m+'\')" class="month-btn p-3 rounded-xl border-2 text-[9px] '+(isActive?'active':'bg-white border-slate-50 text-slate-300')+'">'+m+'</button>';
                }).join('');
            },

            toggleMonth: function(m) {
                if(!editingPayments[activeYear]) editingPayments[activeYear] = [];
                var idx = editingPayments[activeYear].indexOf(m);
                if(idx > -1) editingPayments[activeYear].splice(idx, 1);
                else editingPayments[activeYear].push(m);
                appLogic.renderMonths();
                appLogic.renderYears();
            },

            save: function() {
                var name = document.getElementById('adm-name').value;
                var id = document.getElementById('adm-id').value;
                var price = document.getElementById('adm-price').value;
                if(!name || !id || !price) return showToast("أكمل الخانات");

                db.doc("artifacts/"+appId+"/public/data/clients/"+id).set({
                    name: name, id: id, price: Number(price), 
                    payments: editingPayments, updated: Date.now()
                }).then(function() {
                    showToast("تم الحفظ ✅");
                    appLogic.reset();
                });
            },

            renderList: function() {
                var list = document.getElementById('admin-list');
                list.innerHTML = clients.map(function(c) {
                    return '<div onclick="appLogic.edit(\''+c.id+'\')" class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100 active:bg-slate-50">' +
                           '<div><div class="font-black text-slate-800">'+c.name+'</div><div class="text-[10px] text-slate-400 uppercase">ID: '+c.id+'</div></div>' +
                           '<button onclick="event.stopPropagation(); appLogic.del(\''+c.id+'\')" class="text-red-200 p-2">حذف</button></div>';
                }).join('');
            },

            edit: function(id) {
                var c = clients.find(function(x){ return x.id === id; });
                document.getElementById('adm-name').value = c.name;
                document.getElementById('adm-id').value = c.id;
                document.getElementById('adm-price').value = c.price;
                editingPayments = JSON.parse(JSON.stringify(c.payments || {}));
                appLogic.renderYears();
                window.scrollTo(0,0);
            },

            del: function(id) {
                if(confirm("حذف؟")) db.doc("artifacts/"+appId+"/public/data/clients/"+id).delete();
            },

            renderClient: function(c) {
                document.getElementById('c-name').innerText = c.name;
                var hist = document.getElementById('client-history');
                hist.innerHTML = '';
                var due = 0;
                var now = new Date();
                var curY = now.getFullYear();
                var curM = now.getMonth();

                YEARS.filter(function(y){ return y <= curY; }).reverse().forEach(function(y) {
                    var paid = c.payments ? (c.payments[y] || []) : [];
                    var limit = (y < curY) ? 11 : curM;
                    var unpaid = MONTHS.slice(0, limit + 1).filter(function(m){ return paid.indexOf(m) === -1; });
                    due += (unpaid.length * c.price);

                    var card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-3xl border border-slate-100 shadow-sm";
                    card.innerHTML = '<div class="flex justify-between items-center mb-4 border-b pb-2"><span class="font-black">'+y+'</span><span class="text-[10px] '+(unpaid.length?'text-red-500':'text-green-500')+'">'+(unpaid.length?unpaid.length*c.price+' DH':'خالص')+'</span></div>' +
                                     '<div class="grid grid-cols-4 gap-2">' + 
                                     MONTHS.map(function(m, idx) {
                                         if(idx > limit && paid.indexOf(m) === -1) return '';
                                         var ok = paid.indexOf(m) > -1;
                                         return '<div class="flex flex-col items-center"><div class="w-full h-1 rounded-full '+(ok?'bg-green-400':'bg-red-400')+'"></div><span class="text-[8px] '+(ok?'text-slate-300':'text-red-500 font-bold')+'">'+m+'</span></div>';
                                     }).join('') + '</div>';
                    hist.appendChild(card);
                });
                document.getElementById('c-due').innerText = due;
            },

            reset: function() {
                document.getElementById('adm-name').value = '';
                document.getElementById('adm-id').value = '';
                document.getElementById('adm-price').value = '';
                editingPayments = {};
                activeYear = null;
                document.getElementById('month-grid').classList.add('hidden');
                appLogic.renderYears();
            }
        };

        // بدء التشغيل
        appLogic.init();
    </script>
</body>
</html>
