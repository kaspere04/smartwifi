<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART WIFI AZILAL</title>
    <style>
        :root { --gold: #FFCC00; --dark: #000000; --bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; }
        
        /* تصميم الهيدر بناء على هويتك البصرية */
        header { background: var(--dark); color: white; padding: 40px 20px; text-align: center; border-bottom: 8px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo-container { background: var(--gold); width: 65px; height: 65px; margin: 0 auto 15px; border-radius: 18px; display: flex; align-items: center; justify-content: center; transform: rotate(-3deg); box-shadow: 0 4px 10px rgba(255,204,0,0.3); }
        h1 { margin: 0; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: -1px; }
        .badge { background: var(--gold); color: black; padding: 2px 12px; font-weight: bold; border-radius: 6px; font-size: 14px; display: inline-block; margin-top: 5px; }

        .wrapper { padding: 20px; max-width: 420px; margin: -25px auto 0; position: relative; z-index: 10; }
        .main-card { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border: 1px solid rgba(255,255,255,0.8); }
        
        input { width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 15px; font-size: 20px; text-align: center; font-weight: bold; margin-bottom: 15px; transition: 0.3s; background: #fafafa; }
        input:focus { border-color: var(--gold); background: white; outline: none; }
        
        .primary-btn { width: 100%; padding: 18px; background: var(--dark); color: var(--gold); border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .primary-btn:active { transform: scale(0.96); }

        .hidden { display: none !important; }
        
        /* واجهة المستخدم */
        .user-box { background: #000; color: #fff; padding: 25px; border-radius: 20px; text-align: right; border-left: 10px solid var(--gold); margin-bottom: 15px; position: relative; overflow: hidden; }
        .user-box::after { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 100%; background: linear-gradient(45deg, transparent, rgba(255,204,0,0.05)); }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-item { background: white; padding: 20px; border-radius: 20px; border: 1px solid #eee; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        
        .list-container { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; text-align: right; }
        .row { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f8f8f8; font-size: 14px; font-weight: 600; }

        /* شريط الحالة */
        .cloud-status { margin-top: 20px; font-size: 11px; color: #999; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; }
        .indicator { width: 8px; height: 8px; background: #ddd; border-radius: 50%; }
        .indicator.online { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* أزرار الشهور للمدير */
        .m-btn { padding: 10px; border: 1.5px solid #eee; border-radius: 10px; font-size: 11px; cursor: pointer; background: #fff; color: #bbb; font-weight: bold; }
        .m-btn.active { background: var(--gold); border-color: var(--gold); color: black; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="black"/></svg>
        </div>
        <h1>SMART WIFI</h1>
        <div class="badge">AZILAL</div>
    </header>

    <div class="wrapper">
        <!-- دخول -->
        <div id="sc-login" class="main-card">
            <h2 style="margin:0 0 10px">تسجيل الدخول</h2>
            <p style="font-size:12px; color:#999; margin-bottom:25px">أدخل رقم هاتفك المسجل لدينا</p>
            <input type="number" id="input-id" placeholder="06XXXXXXXX">
            <button class="primary-btn" onclick="app.login()">دخول إلى الحساب</button>
            
            <div class="cloud-status">
                <div id="cloud-ind" class="indicator"></div>
                <span id="cloud-txt">جاري المزامنة...</span>
            </div>
        </div>

        <!-- المشترك -->
        <div id="sc-user" class="hidden">
            <div class="user-box">
                <div style="font-size:10px; font-weight:bold; opacity:0.6">اسم المشترك</div>
                <h2 id="u-name" style="margin:0; font-style: italic;">---</h2>
            </div>
            <div class="grid-stats">
                <div class="stat-item">
                    <div style="font-size:10px; color:#aaa; margin-bottom:5px">واجب الاشتراك</div>
                    <b id="u-price" style="font-size:22px">0 د</b>
                </div>
                <div class="stat-item" style="border-bottom: 5px solid #e74c3c">
                    <div style="font-size:10px; color:#e74c3c; margin-bottom:5px">المبلغ المتبقي</div>
                    <b id="u-due" style="font-size:22px; color:#e74c3c">0 د</b>
                </div>
            </div>
            <div class="list-container" id="u-list"></div>
            <button class="primary-btn" style="margin-top:20px; background:#f0f0f0; color:#333; box-shadow:none" onclick="location.reload()">تسجيل الخروج</button>
        </div>

        <!-- المدير -->
        <div id="sc-admin" class="hidden">
            <div class="main-card" style="text-align:right; margin-bottom:15px; padding:20px">
                <h3 style="margin-top:0">إضافة زبون جديد</h3>
                <input type="text" id="adm-n" placeholder="الاسم الكامل" style="font-size:15px; padding:12px">
                <input type="number" id="adm-i" placeholder="رقم الهاتف (المعرف)" style="font-size:15px; padding:12px">
                <p style="font-size:11px; font-weight:bold; color:#666">تحديد الشهور المؤداة:</p>
                <div id="adm-months" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin-bottom:15px"></div>
                <button class="primary-btn" onclick="app.save()">حفظ البيانات سحابياً</button>
            </div>
            <div id="adm-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        let clients = JSON.parse(localStorage.getItem('azilal_backup') || '[]');
        let selected = [];
        let db;

        const app = {
            async start() {
                try {
                    const cfg = JSON.parse(__firebase_config);
                    const fb = initializeApp(cfg);
                    db = getFirestore(fb);
                    const auth = getAuth(fb);
                    await signInAnonymously(auth);
                    
                    document.getElementById('cloud-ind').classList.add('online');
                    document.getElementById('cloud-txt').innerText = "متصل بالسحابة (مزامنة فورية)";

                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'smart-wifi-azilal-v4';
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'clients'), (snap) => {
                        clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        localStorage.setItem('azilal_backup', JSON.stringify(clients));
                        this.renderAdmin();
                    });
                } catch (e) {
                    document.getElementById('cloud-txt').innerText = "وضع الأوفلاين (سيتم التحديث لاحقاً)";
                }
            },

            login() {
                const id = document.getElementById('input-id').value;
                if (!id) return;

                if (id === "0602359188") {
                    document.getElementById('sc-login').classList.add('hidden');
                    document.getElementById('sc-admin').classList.remove('hidden');
                    this.initMonths();
                    this.renderAdmin();
                    return;
                }

                const u = clients.find(c => c.id === id);
                if (u) {
                    document.getElementById('sc-login').classList.add('hidden');
                    document.getElementById('sc-user').classList.remove('hidden');
                    document.getElementById('u-name').innerText = u.name;
                    document.getElementById('u-price').innerText = u.price + " د";
                    const due = (months.length - u.paid.length) * u.price;
                    document.getElementById('u-due').innerText = due + " د";
                    
                    let h = '<div style="padding:15px; background:#fafafa; font-weight:bold; font-size:12px; border-bottom:1px solid #eee">سجل الدفعات لعام 2026</div>';
                    months.forEach(m => {
                        const ok = u.paid.includes(m);
                        h += `<div class="row"><span>${m}</span><span style="color:${ok?'#2ecc71':'#e74c3c'}">${ok?'مؤدى ✓':'غير مؤدى'}</span></div>`;
                    });
                    document.getElementById('u-list').innerHTML = h;
                } else {
                    alert("الرقم غير موجود في قاعدة البيانات.");
                }
            },

            initMonths() {
                const g = document.getElementById('adm-months');
                g.innerHTML = "";
                months.forEach(m => {
                    const b = document.createElement('div');
                    b.className = "m-btn"; b.innerText = m;
                    b.onclick = () => {
                        if (selected.includes(m)) {
                            selected = selected.filter(x => x !== m);
                            b.classList.remove('active');
                        } else {
                            selected.push(m);
                            b.classList.add('active');
                        }
                    };
                    g.appendChild(b);
                });
            },

            async save() {
                const n = document.getElementById('adm-n').value;
                const i = document.getElementById('adm-i').value;
                if (!n || !i) return alert("املأ الخانات");

                const obj = { id: i, name: n, price: 200, paid: [...selected] };
                
                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'smart-wifi-azilal-v4';
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', i), obj);
                    alert("تم الحفظ والمزامنة بنجاح!");
                    location.reload();
                } catch (e) {
                    alert("تم الحفظ محلياً (سيتم الرفع عند توفر الإنترنت)");
                    clients.push(obj);
                    localStorage.setItem('azilal_backup', JSON.stringify(clients));
                    location.reload();
                }
            },

            renderAdmin() {
                const list = document.getElementById('adm-list');
                if(!list) return;
                list.innerHTML = "<p style='font-size:11px; font-weight:bold; color:#aaa; margin:20px 10px 10px'>لائحة المشتركين المسجلين:</p>";
                clients.forEach(c => {
                    const d = document.createElement('div');
                    d.style = "background:white; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #eee";
                    d.innerHTML = `<div style="text-align:right"><b style="font-size:14px">${c.name}</b><br><small style="color:#aaa">${c.id}</small></div>`;
                    const del = document.createElement('button');
                    del.style = "background:#fff5f5; color:#e74c3c; border:none; padding:8px 12px; border-radius:10px; font-weight:bold; font-size:11px";
                    del.innerText = "حذف";
                    del.onclick = async () => {
                        if (confirm("حذف المشترك؟")) {
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'smart-wifi-azilal-v4';
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', c.id));
                        }
                    };
                    d.appendChild(del);
                    list.appendChild(d);
                });
            }
        };

        window.app = app;
        app.start();
    </script>
</body>
</html>
