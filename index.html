<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart WIFI Azilal</title>
    <style>
        /* تضمين التصميم داخلياً لضمان العمل بدون إنترنت */
        :root { --gold: #FFCC00; --dark: #111827; --gray: #F3F4F6; }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background-color: var(--gray); color: #374151; }
        
        header { background: var(--dark); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--gold); shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { padding: 15px; max-width: 450px; margin: 0 auto; }
        
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #E5E7EB; }
        input { width: 100%; padding: 15px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 16px; margin-bottom: 15px; text-align: center; outline: none; }
        input:focus { border-color: var(--gold); }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-dark { background: var(--dark); color: var(--gold); }
        .btn-ghost { background: #E5E7EB; color: #4B5563; margin-top: 10px; }
        
        .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .month-item { padding: 10px 5px; border: 1px solid #E5E7EB; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; background: #F9FAFB; }
        .month-item.active { background: var(--gold); border-color: var(--dark); font-weight: bold; }

        .client-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: white; border-radius: 12px; margin-bottom: 8px; border-right: 4px solid #D1D5DB; }
        .client-item.paid { border-right-color: #10B981; }

        .user-box { background: var(--dark); color: white; padding: 25px; border-radius: 25px; text-align: center; margin-bottom: 20px; }
        .price { font-size: 40px; font-weight: 900; color: var(--gold); }
        .history-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
        
        .hidden { display: none !important; }
        #toast { fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 50px; font-size: 14px; z-index: 100; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size:20px; letter-spacing:1px;">SMART WIFI <span style="color:var(--gold)">AZILAL</span></h1>
    </header>

    <div class="container">
        <!-- صفحة الدخول -->
        <div id="view-login" class="card">
            <h3 style="text-align:center; margin-top:0">تسجيل الدخول</h3>
            <input type="number" id="login-input" placeholder="أدخل رقم التعريف">
            <button class="btn btn-dark" onclick="handleLogin()">دخول</button>
        </div>

        <!-- صفحة المدير -->
        <div id="view-admin" class="hidden">
            <div class="card">
                <h3 style="margin-top:0; border-right: 4px solid var(--gold); padding-right: 10px;">إضافة مشترك</h3>
                <input type="text" id="adm-name" placeholder="اسم الزبون">
                <input type="number" id="adm-id" placeholder="رقم التعريف">
                <input type="number" id="adm-price" placeholder="الثمن الشهري">
                
                <p style="font-size:12px; font-weight:bold; color:#6B7280; margin-bottom:5px">تحديد الشهور المؤداة:</p>
                <div id="month-grid" class="month-grid"></div>
                
                <button class="btn btn-dark" onclick="saveClient()">حفظ المشترك</button>
                <button class="btn btn-ghost" onclick="resetForm()">تفريغ الخانات</button>
            </div>
            
            <div id="list-container">
                <p style="font-size:12px; color:#9CA3AF; margin-bottom:10px">المشتركين المسجلين:</p>
                <div id="clients-list"></div>
            </div>
            <button class="btn btn-ghost" style="margin-top:20px" onclick="location.reload()">تسجيل الخروج</button>
        </div>

        <!-- صفحة الزبون -->
        <div id="view-client" class="hidden">
            <div class="user-box">
                <small style="opacity:0.7">مرحباً بك</small>
                <h2 id="u-name" style="margin:5px 0">---</h2>
                <div class="price"><span id="u-due">0</span> <small style="font-size:16px">درهم</small></div>
                <p style="font-size:12px; opacity:0.8">إجمالي المتأخرات المتبقية</p>
            </div>
            
            <div class="card">
                <h3 style="font-size:16px; margin-top:0">سجل الدفعات لعام 2025</h3>
                <div id="u-history"></div>
            </div>
            <button class="btn btn-ghost" onclick="location.reload()">خروج</button>
        </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script>
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const ADMIN_PIN = "0602359188";
        let clients = JSON.parse(localStorage.getItem('azilal_wifi_data')) || [];
        let selectedMonths = [];

        // تهيئة شبكة الشهور
        function initMonthGrid() {
            const grid = document.getElementById('month-grid');
            grid.innerHTML = months.map(m => `
                <div id="m-${m}" class="month-item" onclick="toggleMonth('${m}')">${m}</div>
            `).join('');
        }

        function toggleMonth(m) {
            const el = document.getElementById(`m-${m}`);
            if (selectedMonths.includes(m)) {
                selectedMonths = selectedMonths.filter(x => x !== m);
                el.classList.remove('active');
            } else {
                selectedMonths.push(m);
                el.classList.add('active');
            }
        }

        function handleLogin() {
            const pin = document.getElementById('login-input').value;
            if (pin === ADMIN_PIN) {
                showView('view-admin');
                renderAdminList();
                initMonthGrid();
            } else {
                const c = clients.find(x => x.id === pin);
                if (c) {
                    renderClientView(c);
                    showView('view-client');
                } else {
                    showToast("رقم غير مسجل");
                }
            }
        }

        function saveClient() {
            const name = document.getElementById('adm-name').value;
            const id = document.getElementById('adm-id').value;
            const price = document.getElementById('adm-price').value;

            if (!name || !id || !price) return showToast("أكمل البيانات");

            const index = clients.findIndex(x => x.id === id);
            const clientData = { name, id, price: Number(price), paidMonths: [...selectedMonths] };

            if (index > -1) clients[index] = clientData;
            else clients.push(clientData);

            localStorage.setItem('azilal_wifi_data', JSON.stringify(clients));
            showToast("تم الحفظ بنجاح");
            resetForm();
            renderAdminList();
        }

        function renderAdminList() {
            const list = document.getElementById('clients-list');
            list.innerHTML = clients.map(c => `
                <div class="client-item ${c.paidMonths.length > 0 ? 'paid' : ''}">
                    <div>
                        <div style="font-weight:bold; font-size:14px">${c.name}</div>
                        <div style="font-size:10px; color:#999">ID: ${c.id} | ${c.price} DH</div>
                    </div>
                    <div style="display:flex; gap:10px">
                        <button onclick="editClient('${c.id}')" style="border:none; color:blue; background:none; font-size:12px">تعديل</button>
                        <button onclick="deleteClient('${c.id}')" style="border:none; color:red; background:none; font-size:12px">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function editClient(id) {
            const c = clients.find(x => x.id === id);
            document.getElementById('adm-name').value = c.name;
            document.getElementById('adm-id').value = c.id;
            document.getElementById('adm-price').value = c.price;
            selectedMonths = [...c.paidMonths];
            initMonthGrid();
            selectedMonths.forEach(m => document.getElementById(`m-${m}`).classList.add('active'));
            window.scrollTo(0,0);
        }

        function deleteClient(id) {
            if(confirm("هل تريد الحذف؟")) {
                clients = clients.filter(x => x.id !== id);
                localStorage.setItem('azilal_wifi_data', JSON.stringify(clients));
                renderAdminList();
            }
        }

        function renderClientView(c) {
            document.getElementById('u-name').innerText = c.name;
            const curMonthIdx = new Date().getMonth();
            const pastMonths = months.slice(0, curMonthIdx + 1);
            const unpaidCount = pastMonths.filter(m => !c.paidMonths.includes(m)).length;
            
            document.getElementById('u-due').innerText = unpaidCount * c.price;
            
            document.getElementById('u-history').innerHTML = pastMonths.reverse().map(m => `
                <div class="history-row">
                    <span style="font-size:14px">${m}</span>
                    <span style="font-size:12px; font-weight:bold; color:${c.paidMonths.includes(m) ? '#10B981' : '#EF4444'}">
                        ${c.paidMonths.includes(m) ? 'خالص ✓' : 'غير خالص ✖'}
                    </span>
                </div>
            `).join('');
        }

        function resetForm() {
            document.getElementById('adm-name').value = '';
            document.getElementById('adm-id').value = '';
            document.getElementById('adm-price').value = '';
            selectedMonths = [];
            initMonthGrid();
        }

        function showView(id) {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-client').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
